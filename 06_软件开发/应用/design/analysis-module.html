2}+z-\\frac{7}{4}$，则$F_{x}=1$，$F_{y}=2z e^{2yz}+2y$，$F_{z}=2y e^{2yz}+1$。在指定点$(x,y,z)=(\\frac{1}{2},\\frac{1}{2},0)$，三者依次为$1$、$1$、$2$，且$F_{z}\\ne 0$。故$z_{x}=z_{y}=-\\frac{1}{2}$，$dz=-(dx+dy)/2$。来源冲突：补充解析第$4$页写出$2x$并漏负号，且未求出$z=0$；本解严格依据合集原式独立计算。","eligible":false,"source_body_ready":false,"render_ready":true},{"id":"EXAM-M2-2014-12","revision":"R-47a39861fcd7481b","year":2014,"original_number":12,"subject":"高等数学","chapter":"一元函数微分学","point":"切线、法线与曲率","model":"切线与法线","type":"填空题","original_points":4,"difficulty":2,"calculation":1,"core":"极坐标切线：阿基米德螺线给定点切线","method":"转成参数曲线，求斜率和直角坐标","stem":"曲线$L$的极坐标方程为$r=\\theta $，则$L$在$(r,\\theta )=(\\pi /2,\\pi /2)$处的切线的直角坐标方程为$\\underline{\\qquad\\qquad}$。","options":[],"parts":[],"answer":"$y=-(2/\\pi )x+\\pi /2$","solution":"参数式$x=\\theta \\cos \\theta $，$y=\\theta \\sin \\theta $。$\\theta =\\pi /2$时点为$(0,\\pi /2)$，$dx/d\\theta =-\\pi /2$，$dy/d\\theta =1$，故斜率$dy/dx=-2/\\pi $。切线为$y-\\pi /2=-(2/\\pi )x$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2014-13","revision":"R-01421d8bbe814809","year":2014,"original_number":13,"subject":"高等数学","chapter":"定积分应用","point":"弧长与物理几何应用","model":"质心与形心","type":"填空题","original_points":4,"difficulty":2,"calculation":1,"core":"质心计算：变密度细棒的矩积分","method":"一阶矩除以总质量","stem":"一根长度为$1$的细棒位于$x$轴的区间$[0,1]$上，线密度$\\rho (x)=-x^{2}+2x+1$，则细棒质心的横坐标为$\\underline{\\qquad\\qquad}$。","options":[],"parts":[],"answer":"$\\frac{11}{20}$","solution":"总质量$M=\\int _{0}^{1}(-x^{2}+2x+1)dx=\\frac{5}{3}$，关于原点的一阶矩$Mx=\\int _{0}^{1} x(-x^{2}+2x+1)dx=\\frac{11}{12}$。质心横坐标$Mx/M=\\frac{11}{20}$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2014-14","revision":"R-2a963c7857564915","year":2014,"original_number":14,"subject":"线性代数","chapter":"二次型","point":"标准形、规范形与惯性","model":"惯性指数与规范形定参","type":"填空题","original_points":4,"difficulty":3,"calculation":2,"core":"惯性指数：含参二次型的负特征值个数","method":"配方法或主子式判符号，再讨论退化参数","stem":"设二次型$f(x_{1},x_{2},x_{3})=x_{1}^{2}-x_{2}^{2}+2a\\cdot x_{1}\\cdot x_{3}+4x_{2}\\cdot x_{3}$的负惯性指数为$1$，则$a$的取值范围为$\\underline{\\qquad\\qquad}$。","options":[],"parts":[],"answer":"$-2\\le a\\le 2$","solution":"配方为$f=(x_{1}+a\\cdot x_{3})^{2}-(x_{2}-2\\cdot x_{3})^{2}+(4-a^{2})x_{3}^{2}$，换元$y_{1}=x_{1}+a\\cdot x_{3}$，$y_{2}=x_{2}-2\\cdot x_{3}$，$y_{3}=x_{3}$可逆。已有一个负平方项；负惯性指数恰为$1$，当且仅当$4-a^{2}\\ge 0$。零系数不增加负惯性指数，故端点可取，范围$[-2,2]$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2014-15","revision":"R-33a9eb9b69294771","year":2014,"original_number":15,"subject":"高等数学","chapter":"函数、极限与连续","point":"无穷小与泰勒展开","model":"积分型极限与无穷小阶","type":"解答题","original_points":10,"difficulty":3,"calculation":2,"core":"积分型极限：无穷远变上限积分中的相消","method":"洛必达求导后令$1/x$为小量，展开指数","stem":"求极限$\\lim _{x\\to +\\infty } [\\int _{1}^{x} (t^{2}(e^{1/t}-1)-t)dt]/[x^{2} \\ln (1+1/x)]$。","options":[],"parts":[],"answer":"$\\frac{1}{2}$","solution":"由指数展开$t^{2}(e^{1/t}-1)-t=\\frac{1}{2}+O(1/t)$，被积函数趋于$\\frac{1}{2}$，分子趋于$+\\infty $；分母$x^{2}\\ln (1+1/x)~x$亦趋于$+\\infty $。洛必达得分子导数为$x^{2}(e^{1/x}-1)-x\\to \\frac{1}{2}$，分母导数为$2x \\ln (1+1/x)-x/(x+1)\\to 1$。导数分母最终非零，故极限为$\\frac{1}{2}$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2014-16","revision":"R-29621919b3cc4a79","year":2014,"original_number":16,"subject":"高等数学","chapter":"常微分方程","point":"一阶微分方程","model":"一阶分离变量与变量代换","type":"解答题","original_points":10,"difficulty":3,"calculation":2,"core":"一阶可分离方程：初值解与极值","method":"分离变量积分，隐式求导后判断增减","stem":"已知函数$y=y(x)$满足微分方程$x^{2}+y^{2}y' =1-y' $，且$y(2)=0$，求$y(x)$的极大值与极小值。","options":[],"parts":[],"answer":"极大值$y(1)=1$；极小值$y(-1)=0$","solution":"方程化为$y' =(1-x^{2})/(1+y^{2})$。$y' $在$(-\\infty ,-1)$负、$(-1,1)$正、$(1,+\\infty )$负，故$-1$为极小点，$1$为极大点。分离变量得$y^{3}/3+y=x-x^{3}/3+C$；由$y(2)=0$得$C=\\frac{2}{3}$。代$x=1$得$y^{3}/3+y=\\frac{4}{3}$，由左侧严格递增，唯一解$y=1$；代$x=-1$得$y^{3}/3+y=0$，唯一解$y=0$。这些是局部极值，不冒称全实轴绝对最值。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2014-17","revision":"R-c4045f50ea744497","year":2014,"original_number":17,"subject":"高等数学","chapter":"二重积分","point":"对称性与积分定义","model":"奇偶及坐标交换对称性","type":"解答题","original_points":10,"difficulty":3,"calculation":2,"core":"二重积分对称性：坐标交换消去非对称分式","method":"交换$x$、$y$后相加，再用极坐标积分","stem":"设平面区域$D=\\{(x,y):1\\le x^{2}+y^{2}\\le 4$，$x\\ge 0$，$y\\ge 0\\}$，计算二重积分$\\iint _{D} [x\\cdot \\sin (\\pi \\cdot \\sqrt{x^{2}+y^{2}})/(x+y)]dxdy$。","options":[],"parts":[],"answer":"$-\\frac{3}{4}$","solution":"$D$关于$x$、$y$互换对称，设积分为$I$，交换变量后$I=\\iint _{D} y\\cdot \\sin (\\pi \\sqrt{x^{2}+y^{2}})/(x+y)dxdy$。相加得$2I=\\iint _{D} \\sin (\\pi \\sqrt{x^{2}+y^{2}})dxdy$。极坐标$r\\in [1,2]$、$\\theta \\in [0,\\pi /2]$，所以$I=(\\pi /4)\\int _{1}^{2} r \\sin (\\pi r)dr=(\\pi /4)[-r \\cos (\\pi r)/\\pi +\\sin (\\pi r)/\\pi ^{2}]_{1}^{2}=-\\frac{3}{4}$。注意原式根号不能漏读为$\\sin (\\pi (x^{2}+y^{2}))$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2014-18","revision":"R-3da2996cc0db4bbb","year":2014,"original_number":18,"subject":"高等数学","chapter":"多元函数微分学","point":"复合及隐函数求导","model":"复合函数一二阶偏导","type":"解答题","original_points":10,"difficulty":4,"calculation":3,"core":"偏导转微分方程：复合函数满足二阶偏导关系","method":"链式法则化为$f$的常系数微分方程，代初值","stem":"设$f(u)$具有$2$阶连续导数，$z=f(e^{x} \\cos  y)$满足$z_{x}x+z_{y}y=(4z+e^{x} \\cos  y)e^{2x}$。若$f(0)=0$、$f' (0)=0$，求$f(u)$。","options":[],"parts":[],"answer":"$f(u)=(e^{2u}-e^{-2u})/16-u/4$","solution":"令$u=e^{x} \\cos  y$。$u_{x}x+u_{y}y=0$，$u_{x}^{2}+u_{y}^{2}=e^{2x}$，链式法则得$z_{x}x+z_{y}y=f'' (u)e^{2x}$。比较题设得$f'' (u)-4f(u)=u$；$u$可遍及全实轴。通解$f=C_{1}e^{2u}+C_{2}e^{-2u}-u/4$。初值给$C_{1}+C_{2}=0$、$2C_{1}-2C_{2}=\\frac{1}{4}$，解得$C_{1}=\\frac{1}{16}$、$C_{2}=-\\frac{1}{16}$，得到所列解；代回微分方程及两个初值均成立。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2014-19","revision":"R-77fc40b669344d0e","year":2014,"original_number":19,"subject":"高等数学","chapter":"一元函数积分学","point":"积分性质、平均值与不等式","model":"积分不等式证明","type":"解答题","original_points":10,"difficulty":4,"calculation":2,"core":"积分不等式：权函数累积量与单调被积函数","method":"设$G(x)=\\int _{a}^{x} g(t)dt$，得$0\\le G(x)\\le x- a$；令$F$为$f$的原函数，比较$f(a+G(x))g(x)\\le f(x)g(x)$，积分并用链式法则","stem":"设$f(x)$、$g(x)$在$[a,b]$上连续，且$f(x)$单调增加，$0\\le g(x)\\le 1$。证明：$(I) 0\\le \\int _{a}^{x} g(t)dt\\le x-a$，$x\\in [a,b]$；$(II) \\int _{a}^{a+\\int _{a}^{b} g(t)dt} f(x)dx\\le \\int _{a}^{b} f(x)g(x)dx$。","options":[],"parts":[],"answer":"两项不等式均成立，证明见解析。","solution":"$(I)$在$[a,x]$上积分$0\\le g\\le 1$即得$0\\le G(x):=\\int _{a}^{x}g(t)dt\\le x-a$。$(II)$令$F(t)=\\int _{a}^{t} f(s)ds$，$H(x)=\\int _{a}^{x} f(t)g(t)dt-F(a+G(x))$。由$(I)$，$a+G(x)\\in [a,x]$，$f$单调增加使$f(x)\\ge f(a+G(x))$；于是$H' (x)=[f(x)-f(a+G(x))]g(x)\\ge 0$。$H(a)=0$，所以$H(b)\\ge 0$，正是所求不等式。此证明无需假定$f$非负。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2014-20","revision":"R-54c0fecb49c54bbd","year":2014,"original_number":20,"subject":"高等数学","chapter":"函数、极限与连续","point":"函数极限与数列","model":"数列与递推收敛","type":"解答题","original_points":11,"difficulty":3,"calculation":2,"core":"迭代函数极限：反复复合后的面积序列","method":"归纳求迭代函数通式，积分求面积并取极限","stem":"设$f(x)=x/(1+x)$，$x\\in [0,1]$。定义$f_{1}(x)=f(x)$，$f_{2}(x)=f(f_{1}(x))$，…，$fn(x)=f(f_{n-1}(x))$，…；记$Sn$为曲线$y=fn(x)$、直线$x=1$及$x$轴围成图形的面积。求$\\lim _{n\\to \\infty } nSn$。","options":[],"parts":[],"answer":"$1$","solution":"归纳：$f_{1}=x/(1+x)$；若$fn=x/(1+nx)$，则$f(fn)=x/(1+(n+1)x)$，故通式成立。因$fn\\ge 0$，$Sn=\\int _{0}^{1} x/(1+nx)dx=1/n-\\ln (1+n)/n^{2}$。故$nSn=1-\\ln (1+n)/n\\to 1$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2014-21","revision":"R-61fd17aa71264071","year":2014,"original_number":21,"subject":"高等数学","chapter":"定积分应用","point":"旋转体体积","model":"圆盘与柱壳体积综合","type":"解答题","original_points":11,"difficulty":4,"calculation":3,"core":"旋转体体积：由偏导与对角条件恢复围域函数","method":"对$y$积分恢复函数，确定围域后绕$y=-1$积分","stem":"已知$f(x,y)$满足$f_{y}=2(y+1)$，且$f(y,y)=(y+1)^{2}-(2-y)\\ln  y$，求曲线$f(x,y)=0$所围图形绕直线$y=-1$旋转所得旋转体的体积。","options":[],"parts":[],"answer":"$\\pi (2\\ln  2-\\frac{5}{4})($按合集含$\\ln  y$的题干)","solution":"由$f_{y}=2(y+1)$，得$f=y^{2}+2y+\\varphi (x)$。在题设对角线上$y>0$，比较得$\\varphi (x)=1+(x-2)\\ln  x$，故$f=(y+1)^{2}-(2-x)\\ln  x$，$x>0$。围域由$(y+1)^{2}=(2-x)\\ln  x$确定，右侧仅在$1\\le x\\le 2$非负；上下两支在$x=1$、$2$闭合。绕$y=-1$旋转时圆盘半径为$\\sqrt{(2-x)\\ln  x}$，$V=\\pi \\int _{1}^{2}(2-x)\\ln  x dx=\\pi [(2x-x^{2}/2)\\ln  x-2x+x^{2}/4]_{1}^{2}=\\pi (2\\ln 2-\\frac{5}{4})$。补充答案$PDF_{10}$页把$f(y,y)$中的$\\ln  y$遗漏，所得$2\\pi $对应另一题面，不能用于本题。","eligible":false,"source_body_ready":false,"render_ready":true},{"id":"EXAM-M2-2014-22","revision":"R-9b551d2f858e419c","year":2014,"original_number":22,"subject":"线性代数","chapter":"线性方程组","point":"方程组解的结构","model":"矩阵方程逐列求解与通解","type":"解答题","original_points":11,"difficulty":3,"calculation":3,"core":"矩阵方程与通解：右逆矩阵的全部解","method":"先求齐次基础解系，再逐列解非齐次方程","stem":"设$A=\\begin{bmatrix}1 & -2 & 3 & -4 \\\\ 0 & 1 & -1 & 1 \\\\ 1 & 2 & 0 & -3\\end{bmatrix}$，$E$为$3$阶单位阵。$(I)$求$Ax=0$的一个基础解系；$(II)$求满足$AB=E$的所有矩阵$B$。","options":[],"parts":[],"answer":"$(I)\\{(-1,2,3,1)^{T}\\}$；$(II)B=\\begin{bmatrix}2 & 6 & -1 \\\\ -1 & -3 & 1 \\\\ -1 & -4 & 1 \\\\ 0 & 0 & 0\\end{bmatrix}+(-1,2,3,1)^{T}\\cdot (c_{1},c_{2},c_{3})$，$c_{1},c_{2},c_{3}\\in R$。","solution":"$A$行化简为$\\begin{bmatrix}1 & 0 & 0 & 1 \\\\ 0 & 1 & 0 & -2 \\\\ 0 & 0 & 1 & -3\\end{bmatrix}$，秩为$3$，$Ax=0$通解$x=t\\cdot (-1,2,3,1)^{T}$，基础解系由该非零向量组成。取$B_{0}=\\begin{bmatrix}2 & 6 & -1 \\\\ -1 & -3 & 1 \\\\ -1 & -4 & 1 \\\\ 0 & 0 & 0\\end{bmatrix}$，直接乘得$AB_{0}=E$。$AB=E$当且仅当$A(B-B_{0})=0$；$B-B_{0}$的每列均为$Ax=0$的解，因此恰为$B=B_{0}+v\\cdot (c_{1},c_{2},c_{3})$，$v=(-1,2,3,1)^{T}$。这一表示覆盖所有解。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2014-23","revision":"R-e13c1cba65d740b1","year":2014,"original_number":23,"subject":"线性代数","chapter":"特征值与相似","point":"相似判定与构造","model":"相似变换构造","type":"解答题","original_points":11,"difficulty":4,"calculation":2,"core":"相似证明：两个秩一矩阵的同谱可对角化","method":"分别构造零特征子空间与非零特征向量","stem":"证明$n$阶矩阵$A=($全部元素均为$1$的$n\\times n$矩阵)与$B=($前$n-1$列全$0$、最后一列为$(1,2,\\ldots ,n)^{T}$的$n\\times n$矩阵)相似。","options":[],"parts":[],"answer":"$A$与$B$均相似于$\\operatorname{diag}(0,\\ldots ,0,n)$，故彼此相似。","solution":"令$u=(1,\\ldots ,1)^{T}$、$v=(1,2,\\ldots ,n)^{T}$，则$A=uu^{T}$、$B=v e_{n}^{T}$。$Au=nu$，$Bv=nv$。$A$的零空间为$sum(x_{i})=0$，维数$n-1$；$B$的零空间为$x_{n}=0$，维数$n-1(v\\ne 0)$。非零特征值$n$的特征向量$u$或$v$不在各自零空间，故两矩阵均有$n$个无关特征向量并相似于$\\operatorname{diag}(0,\\ldots ,0,n)$。因此$A$与$B$相似。$n=1$时两矩阵同为$[1]$，结论亦成立。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-01","revision":"R-7c0d73ad680f4b0e","year":2015,"original_number":1,"subject":"高等数学","chapter":"一元函数积分学","point":"反常积分","model":"反常积分收敛判别","type":"选择题","original_points":4,"difficulty":2,"calculation":1,"core":"反常积分收敛：幂函数对数与指数衰减比较","method":"分别求原函数或用比较判别","stem":"下列反常积分中收敛的是()。","options":["$\\int _{2}^{+\\infty }1/\\sqrt{x}dx$","$\\int _{2}^{+\\infty }(\\ln  x)/x dx$","$\\int _{2}^{+\\infty }1/(x \\ln  x)dx$","$\\int _{2}^{+\\infty }x/e^{x} dx$"],"parts":[],"answer":"$D$；积分值$3e^{(-2)}$","solution":"$A$的原函数$2\\sqrt{x}$，$B$的原函数$(\\ln  x)^{2}/2$，$C$的原函数$\\ln (\\ln  x)$，在无穷远均趋$+\\infty $。$D$原函数为$-(x+1)e^{-x}$，无穷远趋$0$，积分为$3e^{(-2)}$，故仅$D$收敛。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-02","revision":"R-1d7dcf1b64364d56","year":2015,"original_number":2,"subject":"高等数学","chapter":"函数、极限与连续","point":"连续性与间断点","model":"间断点分类","type":"选择题","original_points":4,"difficulty":3,"calculation":1,"core":"极限定义函数的可去间断点：含参数幂指极限","method":"$x\\ne 0$时取对数得到$f(x)=e^{x}$；原式在$x=0$未定义，邻域极限为$1$，故为可去间断点；不擅自补定义","stem":"函数$f(x)=\\lim _{t\\to 0}(1+\\sin  t/x)^{x^{2}/t}$在$(-\\infty ,+\\infty )$内()。","options":["连续","有可去间断点","有跳跃间断点","有无穷间断点"],"parts":[],"answer":"$B$；$x=0$为可去间断点","solution":"对固定$x\\ne 0$，$t$充分小时底数正，取对数：$(x^{2}/t)\\ln (1+\\sin  t/x)\\to x$，故$f(x)=e^{x}$。原表达式在$x=0$没有定义，不能擅自补成$1$；但$\\lim _{x\\to 0}f(x)=1$有限，故$x=0$为可去间断点，选$B$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-03","revision":"R-b5b8f5c9d46d42c4","year":2015,"original_number":3,"subject":"高等数学","chapter":"一元函数微分学","point":"导数定义与可导性","model":"分段及绝对值函数可导性","type":"选择题","original_points":4,"difficulty":3,"calculation":2,"core":"分段函数可导性：幂乘振荡函数的导数连续","method":"先用差商求零点导数，再比较右侧导函数极限","stem":"设$f(x)=x^{\\alpha } \\cos (1/x^{\\beta })(x>0)$，$f(x)=0(x\\le 0)$，$\\alpha >0$、$\\beta >0$。若$f' (x)$在$x=0$处连续，则()。","options":["$\\alpha -\\beta >1$","$0<\\alpha -\\beta \\le 1$","$\\alpha -\\beta >2$","$0<\\alpha -\\beta \\le 2$"],"parts":[],"answer":"$A$；$\\alpha -\\beta >1$","solution":"左导数为$0$，连续性要求$f' (0)=0$。$x>0$时$f' =\\alpha x^{\\alpha -1}\\cos (1/x^{\\beta })+\\beta x^{\\alpha -\\beta -1}\\sin (1/x^{\\beta })$。连续必须$\\alpha -\\beta -1>0$：取$\\cos $相位为$0$、$\\sin $为$1$的趋零序列，若指数$\\le 0$第二项不能趋$0$。此条件也给$\\alpha >1$，使差商及导函数两项均趋$0$，因此充要。原补充$PDF$第$1$页把$A$印成$\\alpha -\\beta >0$，但第$2$页证明得到>1；采用合集选项。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-04","revision":"R-bc4f4a1b05d84e5d","year":2015,"original_number":4,"subject":"高等数学","chapter":"一元函数微分学","point":"函数性态与零点","model":"极值与拐点判定","type":"选择题","original_points":4,"difficulty":2,"calculation":1,"core":"二阶导图像判拐点：过零与符号变化的区别","method":"只统计二阶导左右异号处，注意导数不连续处","stem":"设$f(x)$在$(-\\infty ,+\\infty )$内连续，其二阶导函数$f'' (x)$图形见题干原页图(合集$PDF$第$79$页)，则曲线$y=f(x)$的拐点个数为()。","options":["$0$","$1$","$2$","$3$。图示符号：负半轴曲线触及$x$轴但两侧同为正；$x=0$两侧由正变负；正半轴曲线过$x$轴由负变正。必须同时保留原图"],"parts":[],"answer":"$C$；$2$个","solution":"拐点对应曲线凹凸性的改变，按原图$f'' $在$x=0$两侧与正半轴过零点两侧共发生两次符号变化；负半轴触轴处两侧同号，不计拐点。$f$连续，二阶导在某点不定义不排除曲线在该点存在拐点。故为$2$，选$C$。原图是题目条件的一部分，不用虚构零点坐标或新画图替代。","eligible":false,"source_body_ready":false,"render_ready":true},{"id":"EXAM-M2-2015-05","revision":"R-b8bf2410b6d7476d","year":2015,"original_number":5,"subject":"高等数学","chapter":"多元函数微分学","point":"复合及隐函数求导","model":"复合函数一二阶偏导","type":"选择题","original_points":4,"difficulty":3,"calculation":2,"core":"复合函数偏导：给定变量变换反求偏导","method":"对$x$、$y$求导形成二元线性方程组","stem":"设$f(u,v)$满足$f(x+y,y/x)=x^{2}-y^{2}$，则$f_{u}$与$f_{v}$在$(u,v)=(1,1)$处依次是()。","options":["$\\frac{1}{2}$，$0$","$0$，$\\frac{1}{2}$","$-\\frac{1}{2}$，$0$","$0$，$-\\frac{1}{ 有无穷多解的充要条件为()。","options":["$a\\notin \\Omega $、$d\\notin \\Omega $","$a\\notin \\Omega $、$d\\in \\Omega $","$a\\in \\Omega $、$d\\notin \\Omega $","$a\\in \\Omega $、$d\\in \\Omega $"],"parts":[],"answer":"$D$","solution":"$A$前两列线性无关，秩至少$2$；$\\det  A=(a-1)(a-2)$，要有无穷多解须$a=1$或$2$，此时秩$2$。增广矩阵用第一行消去后再消去第二列，末行对$b$给$(d-1)(d-2)$。所以一致性要求$d=1$或$2$。满足这些条件时秩$A=$秩增广$=2<3$，故充要条件$D$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-08","revision":"R-c9727d990c5340db","year":2015,"original_number":8,"subject":"线性代数","chapter":"二次型","point":"标准形、规范形与惯性","model":"正交变换与二次型标准形","type":"选择题","original_points":4,"difficulty":1,"calculation":1,"core":"正交换基排列：交换特征向量导致标准形次序变化","method":"按正交基列次序重排平方项系数","stem":"二次型$f(x_{1},x_{2},x_{3})$在正交变换$x=Py$下的标准形为$2y_{1}^{2}+y_{2}^{2}-y_{3}^{2}$，其中$P=(e_{1},e_{2},e_{3})$。若$Q=(e_{1},-e_{3},e_{2})$，则在$x=Qy$下的标准形为()。","options":["$2y_{1}^{2}-y_{2}^{2}+y_{3}^{2}$","$2y_{1}^{2}+y_{2}^{2}-y_{3}^{2}$","$2y_{1}^{2}-y_{2}^{2}-y_{3}^{2}$","$2y_{1}^{2}+y_{2}^{2}+y_{3}^{2}$"],"parts":[],"answer":"$A$","solution":"$Q$将$P$的第二、三基向量交换，第二个新向量是$-e_{3}$，符号改变不影响平方项系数。因此新次序的系数为$2,-1,1$，选$A$。也可写$Q=PC$并计算$C^{T}\\operatorname{diag}(2,1,-1)C=\\operatorname{diag}(2,-1,1)$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-09","revision":"R-4fe1dfb446be4970","year":2015,"original_number":9,"subject":"高等数学","chapter":"一元函数微分学","point":"求导运算","model":"参数曲线求导","type":"填空题","original_points":4,"difficulty":2,"calculation":2,"core":"参数曲线高阶导数：二阶导计算","method":"用$d/dx=(1/x')d/dt$两次求导","stem":"设$x=\\arctan  t$，$y=3t+t^{3}$，则$d^{2}y/dx^{2}$在$t=1$处等于$\\underline{\\qquad\\qquad}$。","options":[],"parts":[],"answer":"$48$","solution":"$dy/dx=(3+3t^{2})/(1/(1+t^{2}))=3(1+t^{2})^{2}$。再次对$x$求导，$d^{2}y/dx^{2}=[12t(1+t^{2})]/[1/(1+t^{2})]=12t(1+t^{2})^{2}$，在$t=1$为$48$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-10","revision":"R-104053e071e34762","year":2015,"original_number":10,"subject":"高等数学","chapter":"一元函数微分学","point":"高阶导数","model":"莱布尼茨与系数法高阶导数","type":"填空题","original_points":4,"difficulty":2,"calculation":1,"core":"高阶导数：多项式乘指数函数在零点的$n$阶导","method":"莱布尼茨公式或指数幂级数系数","stem":"函数$f(x)=x^{2}\\cdot 2^{x}$在$x=0$处的$n$阶导数$f^{(n)}(0)=\\underline{\\qquad\\qquad}$。","options":[],"parts":[],"answer":"$n(n-1)(\\ln 2)^{(n-2)}(n\\ge 2)$；$n=0$、$1$时为$0$","solution":"由莱布尼茨公式，在$x=0$只有$x^{2}$的二阶导非零，所以$f^{(n)}(0)=C(n,2)\\cdot 2\\cdot (\\ln 2)^{(n-2)}=n(n-1)(\\ln 2)^{(n-2)}$。$n=0$、$1$直接代入函数及一阶导均为$0$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-11","revision":"R-0b695336497e4295","year":2015,"original_number":11,"subject":"高等数学","chapter":"一元函数积分学","point":"变上限及含参积分","model":"变上限及含参积分求导","type":"填空题","original_points":4,"difficulty":2,"calculation":1,"core":"变上限积分求导：外系数与上限平方并存","method":"乘积法则与上限求导，代入已知积分值","stem":"设$f(x)$连续，$\\varphi (x)=\\int _{0}^{x^{2}} x f(t)dt$，若$\\varphi (1)=1$、$\\varphi ' (1)=5$，则$f(1)=\\underline{\\qquad\\qquad}$。","options":[],"parts":[],"answer":"$2$","solution":"$\\varphi =x\\int _{0}^{x^{2}} f(t)dt$。求导得$\\varphi ' =\\int _{0}^{x^{2}}f(t)dt+2x^{2}f(x^{2})$。$\\varphi (1)=\\int _{0}^{1}f=1$，所以$5=1+2f(1)$，得$f(1)=2$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-12","revision":"R-5b34588315ea4f94","year":2015,"original_number":12,"subject":"高等数学","chapter":"常微分方程","point":"高阶线性微分方程","model":"高阶线性方程求解与降阶","type":"填空题","original_points":4,"difficulty":2,"calculation":1,"core":"常系数微分方程：极值条件确定初值解","method":"由极值条件得$y(0)=3$、$y' (0)=0$，特征方程求通解并代初值；所得$y'' (0)=6>0$为极小值","stem":"设$y=y(x)$是$y'' +y' -2y=0$的解，且在$x=0$处取得极值$3$，则$y(x)=\\underline{\\qquad\\qquad}$。","options":[],"parts":[],"answer":"$2e^{x}+e^{-2x}$","solution":"特征根$1$、$-2$，$y=C_{1}e^{x}+C_{2}e^{-2x}$。极值条件$y(0)=3$、$y' (0)=0$给$C_{1}+C_{2}=3$、$C_{1}-2C_{2}=0$，故$C_{1}=2$、$C_{2}=1$。$y'' (0)=6>0$，实际是极小值，题面写“极值”不改写成极大值。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-13","revision":"R-da54f80658254883","year":2015,"original_number":13,"subject":"高等数学","chapter":"多元函数微分学","point":"复合及隐函数求导","model":"隐函数偏导及全微分","type":"填空题","original_points":4,"difficulty":2,"calculation":2,"core":"隐函数全微分：三变量指数乘积隐式关系","method":"先定位$z$值，再用隐函数偏导公式","stem":"若$z=z(x,y)$由$e^{x+2y+3z}+xyz=1$确定，则$dz$在$(x,y)=(0,0)$处等于$\\underline{\\qquad\\qquad}$。","options":[],"parts":[],"answer":"$-(\\frac{1}{3})dx-(\\frac{2}{3})dy$","solution":"在$x=y=0$有$e^{3z}=1$，故$z=0$。设$F=e^{x+2y+3z}+xyz-1$，在$(0,0,0)$有$F_{x}=1$、$F_{y}=2$、$F_{z}=3\\ne 0$。隐函数求导给$z_{x}=-\\frac{1}{3}$、$z_{y}=-\\frac{2}{3}$，得到所列全微分。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-14","revision":"R-dc252a4942124e03","year":2015,"original_number":14,"subject":"线性代数","chapter":"特征值与相似","point":"特征值与特征向量","model":"矩阵多项式的谱","type":"填空题","original_points":4,"difficulty":2,"calculation":1,"core":"矩阵多项式特征值：由$A$谱求$B$行列式","method":"逐个代入特征值多项式并取乘积","stem":"设$3$阶矩阵$A$的特征值为$2$、$-2$、$1$，$B=A^{2}-A+E$，$E$为$3$阶单位阵，则$\\det  B=\\underline{\\qquad\\qquad}$。","options":[],"parts":[],"answer":"$21$","solution":"$B$的特征值为$p(\\lambda )=\\lambda ^{2}-\\lambda +1$分别作用于$A$的三个特征值，得到$3$、$7$、$1$。故$\\det  B=3\\cdot 7\\cdot 1=21$。三个特征值互异时也可先相似对角化验证该多项式关系。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-15","revision":"R-d0254aeaa0c74b8e","year":2015,"original_number":15,"subject":"高等数学","chapter":"函数、极限与连续","point":"无穷小与泰勒展开","model":"泰勒抵消与系数匹配","type":"解答题","original_points":10,"difficulty":3,"calculation":2,"core":"泰勒定阶：消去低阶项反求三个参数","method":"展开$\\ln (1+x)$与$\\sin  x$至三阶，比较系数","stem":"设$f(x)=x+a \\ln (1+x)+b\\cdot x\\cdot \\sin  x$，$g(x)=kx^{3}$。若$f$与$g$在$x\\to 0$时是等价无穷小，求$a$、$b$、$k$。","options":[],"parts":[],"answer":"$a=-1$，$b=-\\frac{1}{2}$，$k=-\\frac{1}{3}$","solution":"展开$\\ln (1+x)=x-x^{2}/2+x^{3}/3+o(x^{3})$，$x \\sin  x=x^{2}+o(x^{3})$。故$f=(1+a)x+(b-a/2)x^{2}+(a/3)x^{3}+o(x^{3})$。与非零$kx^{3}$等价要求一、二阶系数为$0$且三阶系数为$k$：$1+a=0$，$b-a/2=0$，$k=a/3$。唯一解$a=-1$、$b=-\\frac{1}{2}$、$k=-\\frac{1}{3}$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-16","revision":"R-9af0f53a1aa94025","year":2015,"original_number":16,"subject":"高等数学","chapter":"定积分应用","point":"旋转体体积","model":"圆盘与柱壳体积综合","type":"解答题","original_points":10,"difficulty":3,"calculation":2,"core":"旋转体体积：正弦围域绕两轴体积相等","method":"圆盘与柱壳积分，分部积分后解幅值","stem":"设$A>0$，$D$由$y=A \\sin  x(0\\le x\\le \\pi /2)$、$y=0$及$x=\\pi /2$围成。$V_{1}$、$V_{2}$分别为$D$绕$x$轴、$y$轴旋转所得体积。若$V_{1}=V_{2}$，求$A$。","options":[],"parts":[],"answer":"$8/\\pi $","solution":"圆盘法$V_{1}=\\pi A^{2}\\int _{0}^{\\pi /2}\\sin ^{2}x dx=\\pi ^{2}A^{2}/4$。柱壳法$V_{2}=2\\pi A\\int _{0}^{\\pi /2}x \\sin  x dx=2\\pi A$，积分值为$[-x \\cos  x+\\sin  x]_{0}^{\\pi /2}=1$。因$A>0$，等式除以$\\pi A$得$\\pi A/4=2$，所以$A=8/\\pi $。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-17","revision":"R-7b890d3bed60466f","year":2015,"original_number":17,"subject":"高等数学","chapter":"多元函数微分学","point":"多元极值与最值","model":"恢复函数后求多元极值","type":"解答题","original_points":11,"difficulty":4,"calculation":3,"core":"二元极值：由混合偏导及边界数据恢复函数","method":"分次积分确定任意函数，解驻点并二阶判别","stem":"已知$f_{x}y(x,y)=2(y+1)e^{x}$，$f_{x}(x,0)=(x+1)e^{x}$，$f(0,y)=y^{2}+2y$，求$f(x,y)$的极值。","options":[],"parts":[],"answer":"在$(0,-1)$处取得极小值$-1$，无极大值","solution":"对$y$积分得到$f_{x}=(y^{2}+2y)e^{x}+\\varphi (x)$。由$f_{x}(x,0)$得$\\varphi =(x+1)e^{x}$；对$x$积分得$f=e^{x}(y^{2}+2y+x)+\\psi (y)$。由$f(0,y)=y^{2}+2y$得$\\psi =0$。解$f_{x}=f_{y}=0$得唯一驻点$(0,-1)$；该点$f_{x}x=1$、$f_{x}y=0$、$f_{y}y=2$，$Hessian$正定，所以极小值$f=-1$。可微全平面上无其他驻点，故没有极大值。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-18","revision":"R-f9a3b57d44a24ac2","year":2015,"original_number":18,"subject":"高等数学","chapter":"二重积分","point":"对称性与积分定义","model":"奇偶及坐标交换对称性","type":"解答题","original_points":10,"difficulty":3,"calculation":2,"core":"二重积分对称性：圆与抛物线围域消去奇项","method":"先消去$xy$项，再按直角坐标积分$x$平方项","stem":"计算$\\iint _{D} x(x+y)dxdy$，其中$D=\\{(x,y):x^{2}+y^{2}\\le 2$，$y\\ge x^{2}\\}$。","options":[],"parts":[],"answer":"$\\pi /4-\\frac{2}{5}$","solution":"$D$关于$y$轴对称，$xy$为$x$的奇函数，所以其积分为$0$。两边界交点$x=±1$、$y=1$；因此$I=2\\int _{0}^{1} x^{2}(\\sqrt{2-x^{2}}-x^{2})dx$。令$x=\\sqrt{2}\\sin \\theta $，$\\theta \\in [0,\\pi /4]$，$\\int _{0}^{1}x^{2}\\sqrt{2-x^{2}}dx=\\int _{0}^{\\pi /4}4\\sin ^{2}\\theta \\cos ^{2}\\theta d\\theta =\\pi /8$。故$I=2\\cdot (\\pi /8)-\\frac{2}{5}=\\pi /4-\\frac{2}{5}$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-19","revision":"R-56f60aa35b714253","year":2015,"original_number":19,"subject":"高等数学","chapter":"一元函数积分学","point":"变上限及含参积分","model":"积分函数性态与零点","type":"解答题","original_points":11,"difficulty":4,"calculation":2,"core":"变上限积分零点：多个积分项构成函数的零点数","method":"求导研究单调性，结合端点值和无穷远趋势","stem":"已知$f(x)=\\int _{x}^{1} \\sqrt{1+t^{2}}dt+\\int _{1}^{x^{2}}\\sqrt{1+t}dt$，求$f(x)$零点的个数。","options":[],"parts":[],"answer":"$2$个","solution":"$f$定义于全实轴；第二积分的路径位于$[0,+\\infty )$，根式有定义。求导$f' =(2x-1)\\sqrt{1+x^{2}}$，故$f$在$(-\\infty ,\\frac{1}{2})$严格递减、$(\\frac{1}{2},+\\infty )$严格递增。$f(-1)>0$，$f(0)=\\int _{0}^{1}[\\sqrt{1+t^{2}}-\\sqrt{1+t}]dt<0$，因此左侧恰有一根于$(-1,0)$。又$f(1)=0$，右侧单调严格递增，因此右侧恰有一根$x=1$。两段合计$2$根，极小点不是零点。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-20","revision":"R-7d3a8f9a6ab04333","year":2015,"original_number":20,"subject":"高等数学","chapter":"常微分方程","point":"微分方程应用","model":"物理规律建立微分方程","type":"解答题","original_points":10,"difficulty":3,"calculation":2,"core":"微分方程建模：牛顿冷却定律与追加时间","method":"建立温差指数衰减模型，用$30$分钟数据定比例系数","stem":"高温物体置于低温介质，任一时刻温度的变化率与物体和介质的温差成正比。初温120℃，介质恒温20℃，冷却$30min$后物温30℃；继续降至21℃还需多久？","options":[],"parts":[],"answer":"还需$30min($累计$60min)$","solution":"以分钟为时间单位，设$T' =-k(T-20)$，$k>0$。解得$T=20+100e^{-kt}$。由$T(30)=30$得$e^{-30k}=\\frac{1}{10}$，即$k=\\ln \\frac{10}{30}$。$T(t)=21$要求$100e^{-kt}=1$，故$t=\\ln 100/k=60min$。已冷却$30min$，所以还需$30min$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-21","revision":"R-3777a480bdf24188","year":2015,"original_number":21,"subject":"高等数学","chapter":"一元函数微分学","point":"中值定理与存在性证明","model":"中值定理构造与存在性证明","type":"解答题","original_points":10,"difficulty":3,"calculation":1,"core":"中值定理构造：凸曲线切线截距的位置","method":"写截距公式，用中值定理比较割线与端点导数","stem":"$f$在$[a,+\\infty )$上具有$2$阶导数，$f(a)=0$，$f' (x)>0$，$f'' (x)>0$。设$b>a$，曲线在$(b,f(b))$处切线与$x$轴交于$(x_{0},0)$，证明$a<x_{0}<b$。","options":[],"parts":[],"answer":"$a<x_{0}<b$","solution":"切线$y-f(b)=f' (b)(x-b)$给$x_{0}=b-f(b)/f' (b)$。$f' >0$且$f(a)=0$，所以$f(b)>0$，立即$x_{0}<b$。由拉格朗日中值定理，$f(b)=f' (ξ)(b-a)$，$ξ\\in (a,b)$。$f'' >0$使$f' $严格递增，$0<f' (ξ)<f' (b)$，故$x_{0}-a=(b-a)[1-f' (ξ)/f' (b)]>0$，得$a<x_{0}$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-22","revision":"R-95b3b0b760194926","year":2015,"original_number":22,"subject":"线性代数","chapter":"矩阵","point":"矩阵运算与方程","model":"矩阵高次幂与幂零结构","type":"解答题","original_points":11,"difficulty":4,"calculation":3,"core":"矩阵方程：幂零矩阵使乘积逆矩阵有限展开","method":"由$A^{3}=0$求$a=0$，将方程写为$(I- A)X(I- A^{2})=I$；两侧乘逆，利用幂零有限展开得$X=I+A+2A^{2}$并代回","stem":"设$A=\\begin{bmatrix}a & 1 & 0 \\\\ 1 & a & -1 \\\\ 0 & 1 & a\\end{bmatrix}$，且$A^{3}=O$。$(I)$求$a$；$(II)$若$X-XA^{2}-AX+AXA^{2}=E$，$E$为$3$阶单位阵，求$X$。","options":[],"parts":[],"answer":"$a=0$；$X=E+A+2A^{2}=\\begin{bmatrix}3 & 1 & -2 \\\\ 1 & 1 & -1 \\\\ 2 & 1 & -1\\end{bmatrix}$","solution":"$A^{3}=0$意味着所有特征值为$0$，故$\\operatorname{tr} A=3a=0$，从而$a=0$；代$a=0$可直接验$A^{3}=0$。原方程分解为$(E-A)X(E-A^{2})=E$。由于$A^{3}=0$，$(E-A)^{(-1)}=E+A+A^{2}$，$(E-A^{2})^{(-1)}=E+A^{2}$；两者可逆，唯一解$X=(E+A+A^{2})(E+A^{2})=E+A+2A^{2}$。代入给所列矩阵，并代回原方程验证为$E$。原答案栏矩阵错误，第$14$页末矩阵与本解一致。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2015-23","revision":"R-cd442c8d973e46ef","year":2015,"original_number":23,"subject":"线性代数","chapter":"特征值与相似","point":"对角化与换基","model":"换基与相似对角化","type":"解答题","original_points":11,"difficulty":3,"calculation":3,"core":"相似对角化：相似谱约束参数并构造$P$","method":"用迹和行列式确定参数，求特征向量组成$P$","stem":"设$A=\\begin{bmatrix}0 & 2 & -3 \\\\ -1 & 3 & -3 \\\\ 1 & -2 & a\\end{bmatrix}$相似于$B=\\begin{bmatrix}1 & -2 & 0 \\\\ 0 & b & 0 \\\\ 0 & 3 & 1\\end{bmatrix}$。$(I)$求$a$、$b$；$(II)$求可逆$P$使$P^{(-1)}AP$为对角阵。","options":[],"parts":[],"answer":"$a=4$，$b=5$；可取$P=\\begin{bmatrix}2 & -3 & -1 \\\\ 1 & 0 & -1 \\\\ 0 & 1 & 1\\end{bmatrix}$，$P^{(-1)}AP=\\operatorname{diag}(1,1,5)$。","solution":"相似保持迹及行列式。$\\operatorname{tr} A=3+a$、$\\operatorname{tr} B=b+2$，得$a-b=-1$。$\\det  A=2a-3$、$\\det  B=b$，得$2a-b=3$，解得$a=4$、$b=5$。$A-E=\\begin{bmatrix}-1 & 2 & -3 \\\\ -1 & 2 & -3 \\\\ 1 & -2 & 3\\end{bmatrix}$为秩$1$矩阵，特征值$1$的独立向量可取$v_{1}=(2,1,0)^{T}$、$v_{2}=(-3,0,1)^{T}$；特征值$5$向量取$v_{3}=(-1,-1,1)^{T}$。令$P=(v_{1},v_{2},v_{3})$，$\\det  P=4\\ne 0$，且$AP=P\\operatorname{diag}(1,1,5)$，故得到所列对角化。补充$PDF_{15}$页展示$A$时末元误写$3$，但$A-E$与最终$P$对应$a=4$；采用独立计算。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2016-01","revision":"R-a39ba071c8c9419d","year":2016,"original_number":1,"subject":"高等数学","chapter":"函数、极限与连续","point":"无穷小与泰勒展开","model":"无穷小等价与阶比较","type":"选择题","original_points":4,"difficulty":2,"calculation":1,"core":"等价无穷小：三种复合无穷小按阶排序","method":"等价替换后比较$x$的幂指数","stem":"设$\\alpha _{1}=x(\\cos (\\sqrt{x})-1)$，$\\alpha _{2}=\\sqrt{x}\\cdot \\ln (1+x^{\\frac{1}{3}})$，$\\alpha _{3}=(1+x)^{\\frac{1}{3}}-1$。当$x\\to 0+$时，按低阶到高阶排列为()。","options":["$\\alpha _{1}$、$\\alpha _{2}$、$\\alpha _{3}$","$\\alpha _{2}$、$\\alpha _{3}$、$\\alpha _{1}$","$\\alpha _{2}$、$\\alpha _{1}$、$\\alpha _{3}$","$\\alpha _{3}$、$\\alpha _{2}$、$\\alpha _{1}$"],"parts":[],"answer":"$B$","solution":"$\\alpha _{1}~-x^{2}/2$，$\\alpha _{2}~x^{\\frac{1}{2}+\\frac{1}{3}}=x^{\\frac{5}{6}}$，$\\alpha _{3}~x/3$。阶从低到高为$\\frac{5}{6}$、$1$、$2$，所以$\\alpha _{2}$、$\\alpha _{3}$、$\\alpha _{1}$，选$B$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2016-02","revision":"R-6358c8d1883e4892","year":2016,"original_number":2,"subject":"高等数学","chapter":"一元函数积分学","point":"不定积分","model":"分段原函数与接点匹配","type":"选择题","original_points":4,"difficulty":2,"calculation":1,"core":"分段原函数： n )<0$；$f(1)>0$，零点定理给$c\\in (\\epsilon ,1)$，$f(c)=0$，完成$(I)$。令$F=f^{2}$。$f(0)=f(c)=0$，罗尔定理给$ξ\\in (0,c)$且$f' (ξ)=0$。$F' =2ff' $，故$F' (0)=F' (ξ)=F' (c)=0$。分别在$[0,ξ]$、$[ξ,c]$对$F' $用罗尔定理，存在$η_{1}\\in (0,ξ)$、$η_{2}\\in (ξ,c)$，满足$F'' (ηj)=2[f f'' +(f' )^{2}](ηj)=0$。两开区间不相交，两根不同。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2017-20","revision":"R-a71dac3e67be4eb4","year":2017,"original_number":20,"subject":"高等数学","chapter":"二重积分","point":"对称性与积分定义","model":"奇偶及坐标交换对称性","type":"解答题","original_points":11,"difficulty":3,"calculation":2,"core":"二重积分对称性：偏心圆上的平方函数","method":"展开消去关于$y$轴奇项，再极坐标积分","stem":"$D=\\{(x,y):x^{2}+y^{2}\\le 2y\\}$，计算$\\iint _{D}(x+1)^{2}dxdy$。","options":[],"parts":[],"answer":"$5\\pi /4$","solution":"$D$是中心$(0,1)$、半径$1$的圆盘，关于$y$轴对称，$\\iint _{D} x=0$。面积为$\\pi $；平移$Y=y-1$后单位圆盘上$\\iint _{x}^{2}=\\int _{0}^{2\\pi }\\cos ^{2}\\theta  d\\theta  \\int _{0}^{1}r^{3}dr=\\pi /4$。展开$(x+1)^{2}$，合计$\\pi /4+\\pi =5\\pi /4$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2017-21","revision":"R-16af5e3db24b4a53","year":2017,"original_number":21,"subject":"高等数学","chapter":"常微分方程","point":"微分方程应用","model":"几何关系建立微分方程","type":"解答题","original_points":11,"difficulty":4,"calculation":3,"core":"微分方程建模：切线法线截距关系决定曲线","method":"写两条直线截距，将$y/x$替换为新函数，积分代初值","stem":"$y$在$(0,\\frac{3}{2})$可导，$y(1)=0$。曲线$L:y=y(x)$任一点$P$的切线与$y$轴交于$(0,Yp)$，法线与$x$轴交于$(Xp,0)$。若$Xp=Yp$，求$L$上$(x,y)$满足的方程。","options":[],"parts":[],"answer":"$(\\frac{1}{2})\\ln (x^{2}+y^{2})+\\arctan (y/x)=0(0<x<\\frac{3}{2}$，取经过$(1,0)$的分支)","solution":"切线截距$Yp=y-xy' $，法线截距$Xp=x+yy' (y' =0$时法线竖直，仍满足此式)。相等得到$(x+y)y' =y-x$。若$x+y=0$，则右端为$-2x\\ne 0$，矛盾。令$u=y/x$，则$y' =u+xu' $，代入得$x(1+u)u' =-(1+u^{2})$。分离积分：$(\\frac{1}{2})\\ln (1+u^{2})+\\arctan  u=-\\ln  x+C$。$x=1$、$u=0$给$C=0$，整理为所列方程，取与初值连续相接的分支。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2017-22","revision":"R-c9624b61ef404ab1","year":2017,"original_number":22,"subject":"线性代数","chapter":"线性方程组","point":"方程组解的结构","model":"基础解系与非齐次通解","type":"解答题","original_points":11,"difficulty":4,"calculation":2,"core":"抽象方程组：列相关与互异特征值确定通解","method":"用谱确定秩，列关系给齐次解，再构造特解","stem":"$3$阶矩阵$A=(\\alpha _{1},\\alpha _{2},\\alpha _{3})$有三个不同特征值，$\\alpha _{3}=\\alpha _{1}+2\\alpha _{2}$。$(I)$证明$r(A)=2$；$(II)$若$\\beta =\\alpha _{1}+\\alpha _{2}+\\alpha _{3}$，求$Ax=\\beta $通解。","options":[],"parts":[],"answer":"$r(A)=2$；$x=(1,1,1)^{T}+k(1,2,-1)^{T}$，$k\\in R$","solution":"列相关给$A(1,2,-1)^{T}=0$，故$0$为特征值。三个不同特征值中另两个非零，$A$可在复数域对角化，秩等于非零特征值个数$2$，实矩阵实秩相同。零空间维数$1$，$(1,2,-1)^{T}$为一组基础解系。$\\beta =A(1,1,1)^{T}$，故该向量为特解；特解加任意齐次解得到通解。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2017-23","revision":"R-c8d4e25964eb4fac","year":2017,"original_number":23,"subject":"线性代数","chapter":"二次型","point":"标准形、规范形与惯性","model":"正交变换与二次型标准形","type":"解答题","original_points":11,"difficulty":3,"calculation":3,"core":"正交化二次型：缺一平方项的标准形确定参数","method":"秩与行列式定参，求实对称矩阵正交特征基","stem":"二次型$f=2x_{1}^{2}-x_{2}^{2}+a x_{3}^{2}+2x_{1}x_{2}-8x_{1}x_{3}+2x_{2}x_{3}$，在正交变换$x=Qy$下的标准形为$\\lambda _{1} y_{1}^{2}+\\lambda _{2} y_{2}^{2}$。求$a$及一个正交矩阵$Q$。","options":[],"parts":[],"answer":"$a=2$；$Q$三列为$(1,0,-1)^{T}/\\sqrt{2}$、$(1,-1,1)^{T}/\\sqrt{3}$、$(1,2,1)^{T}/\\sqrt{6}$；标准形$6y_{1}^{2}-3y_{2}^{2}$","solution":"对称矩阵$M=\\begin{bmatrix}2 & 1 & -4 \\\\ 1 & -1 & 1 \\\\ -4 & 1 & a\\end{bmatrix}$。标准形不含第三项，$\\det M=6-3a=0$，故$a=2$；其左上$2$阶子式$=-3$非零，秩恰为$2$。$a=2$时，三个向量$(1,0,-1)$、$(1,-1,1)$、$(1,2,1)$分别满足$Mv=6v$、$Mv=-3v$、$Mv=0$，且两两正交。单位化后作为$Q$的列，$Q^{T}Q=E$，$Q^{T}MQ=\\operatorname{diag}(6,-3,0)$。所以标准形如所列；特征向量符号和列序可调整，均需与相应标准形顺序一致。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2018-01","revision":"R-61fc2e40f671457f","year":2018,"original_number":1,"subject":"高等数学","chapter":"函数、极限与连续","point":"无穷小与泰勒展开","model":"幂指型极限","type":"选择题","original_points":4,"difficulty":2,"calculation":1,"core":"幂指极限定参：极限为$1$迫使低阶项抵消","method":"取对数，用指数二阶展开比较系数","stem":"","options":[],"parts":[ ulty":3,"calculation":2,"core":"初等变换求逆与迹：行交换及列倍加","method":"写$P_{1}AP_{2}=B$，求$A$逆$=P_{2}B$逆$P_{1}$，再取迹","stem":"交换$3$阶$A$第$2$、$3$行，再将第$2$列的$-1$倍加到第$1$列，得到$B=\\begin{bmatrix}-2 & 1 & -1 \\\\ 1 & -1 & 0 \\\\ -1 & 0 & 0\\end{bmatrix}$，求$\\operatorname{tr}(A^{-1})$。","options":[],"parts":[],"answer":"$-1$","solution":"行交换左乘$S=\\begin{bmatrix}1 & 0 & 0 \\\\ 0 & 0 & 1 \\\\ 0 & 1 & 0\\end{bmatrix}$；列变换右乘$T=\\begin{bmatrix}1 & 0 & 0 \\\\ -1 & 1 & 0 \\\\ 0 & 0 & 1\\end{bmatrix}$，$SAT=B$，故$A^{-1}=T B^{-1} S$。$B^{-1}=\\begin{bmatrix}0 & 0 & -1 \\\\ 0 & -1 & -1 \\\\ -1 & -1 & 1\\end{bmatrix}$，乘得$A^{-1}=\\begin{bmatrix}0 & -1 & 0 \\\\ 0 & 0 & -1 \\\\ -1 & 1 & -1\\end{bmatrix}$，迹$-1$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2022-17","revision":"R-8a29e6085f6649cc","year":2022,"original_number":17,"subject":"高等数学","chapter":"一元函数微分学","point":"导数定义与可导性","model":"导数定义与极限反推导数","type":"解答题","original_points":10,"difficulty":3,"calculation":1,"core":"导数定义反推：两种复合自变量的差商极限","method":"先定$f(1)$，再按导数定义展开复合增量","stem":"$f$在$1$可导，$\\lim _{x\\to 0}[f(e^{x^{2}})-3f(1+\\sin ^{2}x)]/x^{2}=2$，求$f' (1)$。","options":[],"parts":[],"answer":"$-1$","solution":"有限极限先给分子趋$0$，连续性推出$-2f(1)=0$。用可导展开$f(1+h)=f(1)+f' (1)h+o(h)$，两增量均$x^{2}+o(x^{2})$，商极限$=-2f' (1)=2$，故$-1$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2022-18","revision":"R-1389c42ec32b4206","year":2022,"original_number":18,"subject":"高等数学","chapter":"常微分方程","point":"一阶微分方程","model":"一阶线性方程","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"一阶线性方程及弧长：含对数非齐次项","method":"积分因子求初值解，再将弧长根式配成完全平方","stem":"$2xy' -4y=2\\ln  x-1$，$y(1)=\\frac{1}{4}$，求$1\\le x\\le e$曲线弧长。","options":[],"parts":[],"answer":"$y=x^{2}/4-\\ln  x/2$，弧长$(e^{2}+1)/4$","solution":"$x>0$时积分因子$x^{-2}$；$(y/x^{2})' =(\\ln  x-\\frac{1}{2})/x^{3}=-d[\\ln  x/(2x^{2})]/dx$，得$y=Cx^{2}-\\ln  x/2$，初值$C=\\frac{1}{4}$。$y' =(x-1/x)/2$，$\\sqrt{1+(y' )^{2}}=(x+1/x)/2$因$x>0$。积分$1$至$e$给$(e^{2}-1)/4+\\frac{1}{2}=(e^{2}+1)/4$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2022-19","revision":"R-ee8a975c4fdd458d","year":2022,"original_number":19,"subject":"高等数学","chapter":"二重积分","point":"二重积分计算","model":"极坐标二重积分","type":"解答题","original_points":12,"difficulty":4,"calculation":3,"core":"极坐标二重积分：直线与圆弧围域","method":"画域后按角度分段写径向上限，完成积分","stem":"$D=\\{(x,y):0\\le y\\le 2$，$y-2\\le x\\le \\sqrt{4-y^{2}}\\}$，求$\\iint _{D} (x-y)^{2}/(x^{2}+y^{2}) dxdy$。","options":[],"parts":[],"answer":"$2\\pi -2$","solution":"原点单点可赋任意值不改积分，被积函数有界。极坐标第一象限$0\\le \\theta \\le \\pi /2$，$r\\le 2$；第二象限$\\pi /2\\le \\theta \\le \\pi $，直线$y=x+2$给$r\\le 2/(\\sin \\theta -\\cos \\theta )$，该上限$\\le 2$。被积函数变为$(\\cos \\theta -\\sin \\theta )^{2}$，面积元$rdrd\\theta $。第一部分$2\\int _{0}^{\\pi /2}(1-\\sin 2\\theta )d\\theta =\\pi -2$；第二部分径向积分后恒为$2$，积分得$\\pi $。相加$2\\pi -2$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2022-20","revision":"R-1b1204b6b34845c6","year":2022,"original_number":20,"subject":"高等数学","chapter":"多元函数微分学","point":"多元极值与最值","model":"恢复函数后求多元极值","type":"解答题","original_points":12,"difficulty":4,"calculation":3,"core":"恢复多元函数并求极值：偏导组合与轴上初值","method":"换变量转为一阶偏导，积分恢复$f$，用$Hessian$判驻点","stem":"$f$可微，$fu-fv=2(u-v)e^{-(u+v)}$，$f(u,0)=u^{2}e^{-u}$。$(1)g(x,y)=f(x,y-x)$，求$gx$；$(2)$求$f$及极值。","options":[],"parts":[],"answer":"$gx=(4x-2y)e^{-y}$；$f=(u^{2}+v^{2})e^{-(u+v)}$，$(0,0)$极小值$0$，无极大值","solution":"链式$gx=fu-fv=(4x-2y)e^{-y}$。对$x$积分$g=(2x^{2}-2xy)e^{-y}+\\varphi (y)$。边界$g(x,x)=f(x,0)=x^{2}e^{-x}$给$\\varphi (x)=x^{2}e^{-x}$，回代得$f$。偏导为$e^{-(u+v)}(2u-u^{2}-v^{2})$、$e^{-(u+v)}(2v-u^{2}-v^{2})$，驻点$(0,0),(1,1)$。$Hessian$前者$2E$正定；后者对角$0$、非对角$-2e^{-2}$，不定为鞍点。$f\\ge 0$且仅原点$0$，亦全局最小，无极大。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2022-21","revision":"R-70ead7f333cb4be2","year":2022,"original_number":21,"subject":"高等数学","chapter":"一元函数积分学","point":"积分性质、平均值与不等式","model":"凸性与积分不等式","type":"解答题","original_points":12," 0,b>0$","$a=0,b<0$"],"parts":[],"answer":"$C($按通解中任意解均有界理解)","solution":"非零实部指数必在至少一端发散；非零实根亦然；重零根有$x$项发散。纯虚共轭根才使全部解两端有界，因此$a=0,b>0$，通解为有界正弦余弦。零解不能用来反推参数。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2023-05","revision":"R-37474c3df7e249b7","year":2023,"original_number":5,"subject":"高等数学","chapter":"一元函数微分学","point":"导数定义与可导性","model":"分段及绝对值函数可导性","type":"选择题","original_points":5,"difficulty":3,"calculation":2,"core":"参数曲线可导阶次：绝对值导致左右表达式","method":"按参数正负化为分段函数，逐阶比较左右导数","stem":"$y=f(x)$由$x=2t+|t|$、$y=|t|\\sin  t$确定。","options":["$f$连续但$f' (0)$不存在","$f' (0)$存在但$f' $在$0$不连续","$f' $连续但$f'' (0)$不存在","$f'' (0)$存在但$f'' $在$0$不连续"],"parts":[],"answer":"$C$","solution":"$t\\ge 0$时$x=3t$、$f=(x/3)\\sin (x/3)$；$t<0$时$x=t$、$f=-x\\sin  x$。两侧$f' (0)=0$且$f' $趋$0$；右侧$f' /x\\to \\frac{2}{9}$，左侧$\\to -2$，$f'' (0)$不存在。参数映射两侧均单调，合法确定函数。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2023-06","revision":"R-91f18046a64a44ad","year":2023,"original_number":6,"subject":"高等数学","chapter":"一元函数积分学","point":"反常积分","model":"含参反常积分计算","type":"选择题","original_points":5,"difficulty":3,"calculation":2,"core":"含参反常积分最值：对数幂函数","method":"换元$\\ln  x$确定收敛参数，再求参数函数极小值","stem":"$f(\\alpha )=\\int _{2}^{\\infty }1/[x(\\ln  x)^{\\alpha +1}]dx$在$\\alpha _{0}$取最小值，求$\\alpha _{0}$。","options":["$-1/\\ln (\\ln 2)$","$-\\ln (\\ln 2)$","$1/\\ln 2$","$\\ln 2$"],"parts":[],"answer":"$A$","solution":"令$u=\\ln  x$，积分收敛域$\\alpha >0$，$f=(\\ln 2)^{-\\alpha }/\\alpha $。对数导数$(\\ln  f)' =-\\ln (\\ln 2)-1/\\alpha $，由负到正，零点$\\alpha _{0}=-1/\\ln (\\ln 2)>0$，为全局最小；$\\alpha \\to 0+$与$\\infty $时$f$均发散。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2023-07","revision":"R-9d56f01132ac4f0c","year":2023,"original_number":7,"subject":"高等数学","chapter":"一元函数微分学","point":"函数性态与零点","model":"极值与拐点判定","type":"选择题","original_points":5,"difficulty":3,"calculation":1,"core":"极值与拐点定参：多项式乘指数","method":"用一阶导不变号及二阶导变号的判别式条件","stem":"$f=(x^{2}+a)e^{x}$无极值 ":3,"calculation":2,"core":"方程有解推行列式：增广矩阵的秩与余子式","method":"利用已知非零三阶子式及增广行列式为零展开","stem":"方程组$ax_{1}+x_{3}=1$、$x_{1}+ax_{2}+x_{3}=0$、$x_{1}+2x_{2}+ax_{3}=0$、$ax_{1}+bx_{2}=2$有解，且$\\det \\begin{bmatrix}a & 0 & 1 \\\\ 1 & a & 1 \\\\ 1 & 2 & a\\end{bmatrix}=4$，求$\\det \\begin{bmatrix}1 & a & 1 \\\\ 1 & 2 & a \\\\ a & b & 0\\end{bmatrix}$。","options":[],"parts":[],"answer":"$8$","solution":"系数前三行子式非零，系数矩阵秩$3$。有解使4×4增广行列式为$0$。沿右端$(1,0,0,2)^{T}$展开：$0=-$所求子式$+2\\cdot 4$，故$8$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2023-17","revision":"R-ccb043b5ef7d4d31","year":2023,"original_number":17,"subject":"高等数学","chapter":"常微分方程","point":"微分方程应用","model":"几何关系建立微分方程","type":"解答题","original_points":10,"difficulty":3,"calculation":2,"core":"切线截距建模：一阶方程与三角形面积最小值","method":"截距条件建线性方程，初值定曲线，再优化面积","stem":"$L:y=y(x)$，$x>e$，过$(e^{2},0)$。任一点到$y$轴距离等于切线在$y$轴截距。$(1)$求$y$；$(2)$求切线与两坐标轴围三角形面积最小的点与最小面积。","options":[],"parts":[],"answer":"$(1)y=x(2-\\ln  x)$；$(2)(e^{\\frac{3}{2}},e^{\\frac{3}{2}}/2)$，最小面积$e^{3}$","solution":"截距$y-xy' $，题设给$x=y-xy' $，即$y' -y/x=-1$。除$x$积分$(y/x)' =-1/x$，初值给$y=x(2-\\ln  x)$。切线截距$Y=x$、$X=x/(\\ln  x-1)>0$，面积$S=x^{2}/[2(\\ln  x-1)]$。$S' =x(2\\ln  x-3)/[2(\\ln  x-1)^{2}]$，在$e$至$e^{\\frac{3}{2}}$负、其后正，最小$e^{3}$；代回曲线求点。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2023-18","revision":"R-254e7cbb2b7045c1","year":2023,"original_number":18,"subject":"高等数学","chapter":"多元函数微分学","point":"多元极值与最值","model":"无约束多元极值","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"多元极值：指数余弦复合与无限驻点列","method":"解驻点，按整数奇偶以$Hessian$分类","stem":"求$f(x,y)=x e^{\\cos  y}+x^{2}/2$的极值。","options":[],"parts":[],"answer":"$(-e,2k\\pi )$取极小值$-e^{2}/2(k\\in Z)$；无极大值","solution":"$f'_{x}=e^{\\cos  y}+x$，$f'_{y}=-x \\sin  y e^{\\cos  y}$，驻点$x=-e^{\\cos  y}\\ne 0$，$y=k\\pi $。$f''_{xx}=1$、$f''_{xy}=0$，$f''_{yy}$在驻点为$e^{2\\cos  y}\\cos  y$。$k$偶正定，$k$奇不定为鞍点，无极大。亦配方$f=(x+e^{\\cos  y})^{2}/2-e^{2\\cos  y}/2\\ge -e^{2}/2$，极小均全局最小。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2023-19","revision":"R-10435666829c40d0","year":2023,"original_number":19,"subject":"高等数学","chapter":"定积分应用","point":"旋转体体积","model":"圆盘与柱壳体积综合","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"反常积分几何应用：无界区域面积及旋转体积","method":"分别写面积积分与圆盘法体积积分，换元及有理拆分","stem":"$D=\\{(x,y):x\\ge 1$，$0\\le y\\le 1/[x \\sqrt{1+x^{2}}]\\}$。$(1)$面积；$(2)$绕$x$轴旋转体积。","options":[],"parts":[],"answer":"$S=\\ln (1+\\sqrt{2})$，$V=\\pi (1-\\pi /4)$","solution":"面积积分$\\int _{1}^{\\infty }dx/[x \\sqrt{1+x^{2}}]$，令$u=1/x$化为$\\int _{0}^{1}du/\\sqrt{1+u^{2}}=\\ln (1+\\sqrt{2})$。圆盘体积$\\pi \\int _{1}^{\\infty }dx/[x^{2}(1+x^{2})]$，分解$1/x^{2}-1/(1+x^{2})$给$\\pi (1-\\pi /4)$。尾部分别$x^{-2}$、$x^{-4}$保证收敛。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2023-20","revision":"R-c9390fc7b3ae47b4","year":2023,"original_number":20,"subject":"高等数学","chapter":"二重积分","point":"二重积分计算","model":"极坐标二重积分","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"极坐标二重积分：椭圆环形扇域","method":"极坐标写径向上下限，分离径向后用$\\tan \\theta $积分","stem":"第一象限$D$由$x^{2}+y^{2}-xy=1$、$=2$及$y=\\sqrt{3} x$、$y=0$围成，求$\\iint _{D_{1}}/(3x^{2}+y^{2})dxdy$。","options":[],"parts":[],"answer":"$\\sqrt{3} \\pi  \\ln \\frac{2}{24}$","solution":"极角$0\\le \\theta \\le \\pi /3$，$r^{2}$界$1/(1-\\cos \\theta \\sin \\theta )$至$2/(1-\\cos \\theta \\sin \\theta )$，因子分母严格正。积分径向$dr/r$，得$\\ln \\frac{2}{2}$与$\\theta $无关，再积分$\\int _{0}^{\\pi /3}d\\theta /(3\\cos ^{2}\\theta +\\sin ^{2}\\theta )$。令$t=\\tan \\theta $，等$\\int _{0}^{\\sqrt{3}}dt/(3+t^{2})=\\pi /(4\\sqrt{3})$，故$\\pi \\ln 2/(8\\sqrt{3})$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2023-21","revision":"R-ff17b37d410246e4","year":2023,"original_number":21,"subject":"高等数学","chapter":"一元函数微分学","point":"中值定理与存在性证明","model":"中值定理构造与存在性证明","type":"解答题","original_points":12,"difficulty":4,"calculation":2,"core":"二阶导存在性与下界：对称端点和内点极值","method":"两侧泰勒展开，结合连续介值；极值点展开后估计距离","stem":"$a>0$，$f$在$[-a,a]$有二阶连续导数。证明：$(1)f(0)=0$时存在$ξ\\in (-a,a)$使$f'' (ξ)=[f(a)+f(-a)]/a^{2}$；$(2)f$在内部取极值时存在$η\\in (-a,a)$使$|f'' (η)|\\ge |f(a)-f(-a)|/(2a^{2})$。","options":[],"parts":[],"answer":"均成立","solution":"$(1)$在$0$用二阶泰勒到$±a$，线性项相消，得端点和$=a^{2}[f'' (ξ_{1})+f'' (ξ_{2})]/2$。$f'' $连续，介值定理给内部点取平均。$(2)$极值点$x_{0}$有$f' (x_{0})=0$，从$x_{0}$向两端泰勒得端点差。令$M=max_{ξ_{1},ξ_{2}}|f'' |$，区间在内部，差绝对值$\\le M[(a-x_{0})^{2}+(a+x_{0})^{2}]/2=M(a^{2}+x_{0}^{2})\\le 2a^{2}M$。$M$在内部$η$达到，得所求。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2023-22","revision":"R-a185066e671d433c","year":2023,"original_number":22,"subject":"线性代数","chapter":"特征值与相似","point":"对角化与换基","model":"换基与相似对角化","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"相似对角化：线性变换给定矩阵作用","method":"代标准基恢复矩阵，求特征值及独立特征向量组","stem":"任意$x$有$A(x_{1},x_{2},x_{3})^{T}=(x_{1}+x_{2}+x_{3},2x_{1}-x_{2}+x_{3},x_{2}-x_{3})^{T}$。$(1)$求$A$；$(2)$求可逆$P$及对角$\\Lambda $使$P^{-1} AP=\\Lambda $。","options":[],"parts":[],"answer":"$A=\\begin{bmatrix}1 & 1 & 1 \\\\ 2 & -1 & 1 \\\\ 0 & 1 & -1\\end{bmatrix}$；$P=\\begin{bmatrix}-1 & 0 & 4 \\\\ 0 & 1 & 3 \\\\ 2 & -1 & 1\\end{bmatrix}$，$\\Lambda =\\operatorname{diag}(-1,-2,2)$","solution":"取标准基得到$A$。特征多项式$\\det (\\lambda E-A)=(\\lambda +1)(\\lambda +2)(\\lambda -2)$，不同特征值给无关特征向量。分别取$(-1,0,2)^{T}$、$(0,1,-1)^{T}$、$(4,3,1)^{T}$，逐项$Av=\\lambda v$，构成$P$可逆且$AP=P\\Lambda $，所以所求成立。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-01","revision":"R-f944f7e733934cb4","year":2024,"original_number":1,"subject":"高等数学","chapter":"函数、极限与连续","point":"连续性与间断点","model":"间断点分类","type":"选择题","original_points":5,"difficulty":3,"calculation":2,"core":"间断点分类：绝对值幂指函数","method":"逐一考察$0$、$1$、$2$处左右极限，区分可去和无穷间断","stem":"$f(x)=|x|^{1/((1-x)(x-2))}$，第一类间断点个数：","options":["$3$","$2$","$1$","$0$"],"parts":[],"answer":"$C$；$1$个","solution":"潜在点$0$、$1$、$2$。$1$处指数对数形式$\\ln |x|/[(1-x)(x-2)]$趋$1$，左右$f$趋$e$，为可去间断。$0$处指数趋 {2}$收敛推出$\\int f$收敛；②存在$p>1$使$\\lim _{x\\to \\infty }x^{p} f(x)$存在，则$\\int f$收敛；③$\\int f$收敛推出存在$p>1$使上述极限存在。正确个数：","options":["$0$","$1$","$2$","$3$。(“存在”指有限极限。)"],"parts":[],"answer":"$B$；仅②","solution":"①反例$f=1/(1+x)$；平方可积而本身不可积。②有限极限保证尾部$f\\le M/x^{p}$，比较可积。③反例$f=1/[(x+2)\\ln ^{2}(x+2)]$，积分收敛，但任意$p>1$，$x^{p} f(x)\\to \\infty $，无有限极限。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-08","revision":"R-21bf7c8736364703","year":2024,"original_number":8,"subject":"线性代数","chapter":"矩阵","point":"矩阵运算与方程","model":"矩阵方程","type":"选择题","original_points":5,"difficulty":3,"calculation":2,"core":"矩阵方程求矩阵：$P$转置与$P$平方混合乘积","method":"左右乘逆矩阵，注意次序并核对选项","stem":"$P=\\begin{bmatrix}1 & 0 & 0 \\\\ 0 & 1 & 0 \\\\ 1 & 0 & 1\\end{bmatrix}$，$P^{T}AP^{2}=\\begin{bmatrix}a+2c & 0 & c \\\\ 0 & b & 0 \\\\ 2c & 0 & c\\end{bmatrix}$，求$A$。","options":["$\\operatorname{diag}(c,a,b)$","$\\operatorname{diag}(b,c,a)$","$\\operatorname{diag}(a,b,c)$","$\\operatorname{diag}(c,b,a)$"],"parts":[],"answer":"$C$","solution":"$P^{2}=\\begin{bmatrix}1 & 0 & 0 \\\\ 0 & 1 & 0 \\\\ 2 & 0 & 1\\end{bmatrix}$。代入$\\operatorname{diag}(a,b,c)$直接乘得所列右端；$P$及$P^{2}$可逆，$A=(P^{T})^{-1} M(P^{2})^{-1}$唯一，故$C$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-09","revision":"R-57b21fb49aa941ba","year":2024,"original_number":9,"subject":"线性代数","chapter":"向量与矩阵秩","point":"矩阵秩","model":"伴随矩阵秩","type":"选择题","original_points":5,"difficulty":4,"calculation":2,"core":"伴随矩阵与秩：二次矩阵关系","method":"先排除满秩，再由伴随为零推出平方零及秩不等式","stem":"$A$为$4$阶，$A^{*}$为伴随，$A(A-A^{*})=0$且$A\\ne A^{*}$，$r(A)$为：","options":["$0$或$1$","$1$或$3$","$2$或$3$","$1$或$2$"],"parts":[],"answer":"$D$","solution":"若$A$可逆则从乘积$0$得$A=A^{*}$，矛盾，故$\\det A=0$，$AA^{*}=0$，于是$A^{2}=0$。又$A\\ne 0($零矩阵伴随也零)，且$im A⊂ker A$，$2r(A)\\le 4$，故秩$1$或$2$。分别取$E_{14}$和$E_{13}+E_{24}$可实现，二者伴随均$0$且$A\\ne 0$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-10","revision":"R-48498cb1fd8040d0","year":2024,"original_number":10,"subject":"线性代数","chapter":"特征值与相似","point":"对角化与换基","model":"可对角化的重数条件","type":"选择题","original_points":5,"difficulty":3,"calculation":1,"core":"交换矩阵可对角化：互异谱的充分性","method":"在$A$的特征基上用交换关系令$B$保特征子空间；反例否定必要性","stem":"$A$、$B$为$2$阶且$AB=BA$，“$A$有两个不相等特征值”是“$B$可对角化”的何条件？$A.$充要；$B.$充分非必要；$C.$必要非充分；$D.$均非。","options":[],"parts":[],"answer":"$B$","solution":"$A$的两条特征向量构成基，交换关系让$B$保持$A$的每个一维特征子空间，所以同一基下$B$对角。反向$A=B=E$时$B$可对角化但$A$无不同特征值。","eligible":false,"source_body_ready":true,"render_ready":false},{"id":"EXAM-M2-2024-11","revision":"R-dce3d32a20564b79","year":2024,"original_number":11,"subject":"高等数学","chapter":"一元函数微分学","point":"切线、法线与曲率","model":"曲率与曲率圆","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"曲率圆：抛物线在竖直切线点","method":"改写$x$为$y$函数求曲率和曲率中心","stem":"$y^{2}=x$在$(0,0)$的曲率圆方程。","options":[],"parts":[],"answer":"$(x-\\frac{1}{2})^{2}+y^{2}=\\frac{1}{4}$","solution":"改用参数$y=t$、$x=t^{2}$，$0$处切向量$(0,1)$、二阶向量$(2,0)$，曲率$2$、半径$\\frac{1}{2}$、法向朝右。圆心$(\\frac{1}{2},0)$，故所列方程。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-12","revision":"R-87402f0b28a7461a","year":2024,"original_number":12,"subject":"高等数学","chapter":"多元函数微分学","point":"多元极值与最值","model":"无约束多元极值","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"多项式多元极值：分离变量的驻点分类","method":"求全部驻点，$Hessian$区分极大点与鞍点","stem":"$f(x,y)=2x^{3}-9x^{2}-6y^{4}+12x+24y$的极值点。","options":[],"parts":[],"answer":"$(1,1)$，为极大值点；极大值$23$","solution":"$f'_{x}=6(x-1)(x-2)$，$f'_{y}=24(1-y^{3})$，驻点$(1,1),(2,1)$。$Hessian$分别$\\operatorname{diag}(-6,-72)$负定和$\\operatorname{diag}(6,-72)$不定，故前者极大、后者鞍点，无极小。代入极大值$23$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-13","revision":"R-266957c5045d4278","year":2024,"original_number":13,"subject":"高等数学","chapter":"常微分方程","point":"一阶微分方程","model":"一阶分离变量与变量代换","type":"填空题","original_points":5,"difficulty":3,"calculation":2,"core":"一阶变量代换：导数依赖$x+y$","method":"置$u=x+y$化可分离方程，初值确定隐式解","stem":"$y' =1/(x+y)^{2}$，$y(1)=0$，求解。","options":[],"parts":[],"answer":"$y=\\arctan (x+y)-\\pi /4$","solution":"$u=x+y$，$u' =1+1/u^{2}>0$，$dx/du=u^{2}/(1+u^{2})$，积分$x=u-\\arctan  u+C$，初值$u=1$给$C=\\pi /4$。化得所列。初值所在$u>0$分支，$x>\\pi /4$，不能跨越$u=0$极点。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-14","revision":"R-4322b52f26fc421e","year":2024,"original_number":14,"subject":"高等数学","chapter":"一元函数微分学","point":"高阶导数","model":"莱布尼茨与系数法高阶导数","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"高阶导数：二次多项式乘指数","method":"莱布尼茨只保留多项式前三项","stem":"$f(x)=x^{2}(e^{x}-1)$，求$f^{(5)}(1)$。","options":[],"parts":[],"answer":"$31e$","solution":"$-x^{2}$五阶导为$0$。莱布尼茨仅保留多项式$0$、$1$、$2$阶导，$f^{(5)}=e^{x}[x^{2}+5(2x)+10(2)]=(x^{2}+10x+20)e^{x}$，代$1$得$31e$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-15","revision":"R-a64f3688eed04f82","year":2024,"original_number":15,"subject":"高等数学","chapter":"定积分应用","point":"弧长与物理几何应用","model":"运动与平均速度","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"平均速度：含正弦的速度函数","method":"平均速度等于位移除以时间；积分$v(t)$，除以$3$并解参数，不对$v$取绝对值","stem":"$v(t)=t+k \\sin (\\pi t)$，$t=0$到$3$的平均速度$\\frac{5}{2}$，求$k$。","options":[],"parts":[],"answer":"$3\\pi /2$","solution":"平均速度$=(\\frac{1}{3})\\int _{0}^{3}v dt=(\\frac{1}{3})(\\frac{9}{2}+2k/\\pi )$。令等$\\frac{5}{2}$得$k=3\\pi /2$。此处平均速度为位移除时间，不取$|v|$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-16","revision":"R-ef839ae242a544bc","year":2024,"original_number":16,"subject":"线性代数","chapter":"向量与矩阵秩","point":"线性关系与向量组","model":"相关性、极大无关组与线性表示","type":"填空题","original_points":5,"difficulty":3,"calculation":2,"core":"向量相关与两两无关：四维三向量定参","method":"消元求秩为$2$的参数，再检查两两无关","stem":"$\\alpha _{1}=(a,1,-1,1)^{T}$，$\\alpha _{2}=(1,1,b,a)^{T}$，$\\alpha _{3}=(1,a,-1,1)^{T}$，三向量相关但任两向量无关，求$ab$。","options":[],"parts":[],"answer":"$-4$；$a=-2,b=2$","solution":"$\\alpha _{1}$与$\\alpha _{3}$无关给$a\\ne 1$；三向量秩$2$，所以$\\alpha _{2}=s\\alpha _{1}+t\\alpha _{3}$。第三、四分量给$b=-(s+t)$、$a=s+t$，故$b=-a$；前两分量相加给$2=(a+1)(s+t)=a(a+1)$。解$a=1$或$-2$，排除$1$，得$-2$、$2$。此时$s=t=-1$，确实任意两向量无关。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-17","revision":"R-b7e8b9052da347c0","year":2024,"original_number":17,"subject":"高等数学","chapter":"二重积分","point":"二重积分计算","model":"对称消项后二重积分","type":"解答题","original_points":10,"difficulty":3,"calculation":2,"core":"对称域二重积分：双曲线与互为倒数斜率直线","method":"交换$x$与$y$消去反对称项，再极坐标计算面积","stem":"第一象限$D$由$xy=\\frac{1}{3}$、$xy=3$、$y=x/3$、$y=3x$围成，求$\\iint _{D}(1+x-y)dxdy$。","options":[],"parts":[],"answer":"$8\\ln \\frac{3}{3}$","solution":"域交换$x,y$保持不变，所以$\\iint _{x}=\\iint _{y}$，积分等面积。令$u=xy$、$v=y/x$，$u,v$分别$\\in [\\frac{1}{3},3]$；正象限逆映射$x=\\sqrt{u/v}$、$y=\\sqrt{uv}$，$Jacobian$绝对值$1/(2v)$。面积$=(3-\\frac{1}{3})\\int _{\\frac{1}{3}}^{3}dv/(2v)=8\\ln \\frac{3}{3}$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-18","revision":"R-36fde9208b814d29","year":2024,"original_number":18,"subject":"高等数学","chapter":"常微分方程","point":"高阶线性微分方程","model":"高阶线性方程求解与降阶","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"欧拉方程与定积分：指定指数换元","method":"$x=e$的$t$次方化常系数方程，初值定解后换元积分","stem":"$x^{2}y'' +xy' -9y=0$，$y(1)=2$、$y' (1)=6$。$(1)$用$x=e^{t}$化简并求$y$；$(2)$求$\\int _{1}^{2} y(x)\\sqrt{4-x^{2}}dx$。","options":[],"parts":[],"answer":"$(1)y=2x^{3}(x>0)$；$(2)22\\sqrt{3}/5$","solution":"$Y(t)=y(e^{t})$，$y' =Y' /x$、$y'' =(Y'' -Y' )/x^{2}$，方程$Y'' -9Y=0$。$Y=C_{1}e^{3t}+C_{2}e^{-3t}$，初值$C_{1}+C_{2}=2$、$3C_{1}-3C_{2}=6$，得$2$、$0$。积分设$u=4-x^{2}$，$2x^{3}dx=-(4-u)du$，得到$\\int _{0}^{3}(4-u)\\sqrt{u} du=8\\cdot 3^{\\frac{3}{2}}/3-2\\cdot 3^{\\frac{5}{2}}/5=22\\sqrt{3}/5$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-19","revision":"R-7d093ca567714595","year":2024,"original_number":19,"subject":"高等数学","chapter":"定积分应用","point":"旋转体体积","model":"旋转体体积最值","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"旋转体积最值：移动的两条竖直边界","method":"写定积分，用变上限求导优化，再分部积分求最值","stem":"$t>0$，$y=\\sqrt{x}e^{-x}$与$x=t$、$x=2t$、$x$轴围成域绕$x$轴旋转体积$V(t)$，求其最大值。","options":[],"parts":[],"answer":"$\\pi (\\ln \\frac{2}{16}+\\frac{3}{64})$，$t=\\ln 2$","solution":"$V=\\pi \\int _{t}^{2t}xe^{-2x}dx$，$V' =\\pi t e^{-2t}(4e^{-2t}-1)$。$t\\in (0,\\ln 2)$增，其后减，唯一全局最大在$\\ln 2$。原函数$-(x/2+\\frac{1}{4})e^{-2}x$，代入给所列值；两端$V$趋$0$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-20","revision":"R-ef61020c3a274dad","year":2024,"original_number":20,"subject":"高等数学","chapter":"多元函数微分学","point":"复合及隐函数求导","model":"复合函数一二阶偏导","type":"解答题","original_points":12,"difficulty":4,"calculation":3,"core":"复合函数二阶偏导恢复函数","method":"链式展开消去纯二阶项，积分混合偏导并用边界条件定函数","stem":"$f(u,v)$有二阶连续偏导，$g(x,y)=f(2x+y,3x-y)$，$gxx+gxy-6gyy=1$。$(1)$求$fuv$；$(2)fu(u,0)=u e^{-u}$，$f(0,v)=v^{2}/50-1$，求$f$。","options":[],"parts":[],"answer":"$(1)\\frac{1}{25}$；$(2)f=uv/25-(u+1)e^{-u}+v^{2}/50$","solution":"链式：$gxx=4fuu+12fuv+9fvv$，$gxy=2fuu+fuv-3fvv$，$gyy=fuu-2fuv+fvv$，组合等$25fuv$，得$\\frac{1}{25}$。积分$fu=v/25+h(u)$，边界给$h=u e^{-u}$，再对$u$积分得$f=uv/25-(u+1)e^{-u}+j(v)$；另一边界给$j=v^{2}/50$。代回两边界和微分组合均成立。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2024-21","revision":"R-2cf511252b8f4127","year":2024,"original_number":21,"subject":"高等数学","chapter":"一元函数微分学","point":"不等式与凸性","model":"凸性与等价命题","type":"解答题","original_points":12,"difficulty":4,"calculation":2,"core":"函数与线性插值误差界：二阶导有界","method":"构造抛物线辅助函数用中值定理反证；积分得梯形误差界","stem":"$f$有二阶导数，$f' (0)=f' (1)$，$|f'' (x)|\\le 1$。证明：$(1)0<x<1$时$|f(x)-f(0)(1-x)-f(1)x|\\le x(1-x)/2$；$(2)|\\int _{0}^{1}f(x)dx-[f(0)+f(1)]/2|\\le \\frac{1}{12}$。","options":[],"parts":[],"answer":"两个不等式成立","solution":"记$h=f-f(0)(1-x)-f(1)x$，$h(0)=h(1)=0$；$p=x(1-x)/2$。$h-p$的二阶导$f'' +1\\ge 0$，凸函数位于端点弦线之下，故$h\\le p$；$h+p$的二阶导$f'' -1\\le 0$，凹函数位于弦线上方，故$h\\ge -p$。得$(1)$。积分后$|\\int h|\\le \\int p=\\frac{1}{12}$，$\\int h$即$(2)$左侧括号。二阶导不必连续，中值定理仍能推出凸凹性
