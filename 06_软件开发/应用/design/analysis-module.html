:[],"answer":"待人工检查；按当前$PDF$完整题面推导为$D$，与参考答案$B$冲突","solution":"②有限极限和连续性推出$f(0)=|f(0)|$，于是为导数定义。④分子非负，双侧有限极限必为$0$，差商绝对值趋$0$，故$f' (0)=0$。③同理先由连续性得到$f(0)=0$，再由左右符号得极限$0$，推出$f' (0)=0$。①先得$f(0)\\ge 0$；若>0，连续性使局部$f>0$，表达式就是差商；若$=0$则化为③。因此当前完整题面四条件均充分，应为$D$；源答案$B$的①③论证将双侧极限假设拆为两个不相等单侧值，与题设不符。未据此猜测或修改原始题面，整题待人工检查。","eligible":false,"source_body_ready":false,"render_ready":true},{"id":"EXAM-M2-2025-08","revision":"R-db21a6b2209c4726","year":2025,"original_number":8,"subject":"线性代数","chapter":"二次型","point":"标准形、规范形与惯性","model":"惯性指数与规范形定参","type":"选择题","original_points":5,"difficulty":2,"calculation":1,"core":"惯性指数定参：一个正谱两个负谱","method":"对对称矩阵二次型配方，以正负惯性指数定参数","stem":"$A=\\begin{bmatrix}1 & 2 & 0 \\\\ 2 & a & 0 \\\\ 0 & 0 & b\\end{bmatrix}$有一个正特征值和两个负特征值，则：","options":["$a>4,b>0$","$a<4,b>0$","$a>4,b<0$","$a<4,b<0$"],"parts":[],"answer":"$D$","solution":"二次型配方为$(x_{1}+2x_{2})^{2}+(a-4)x_{2}^{2}+bx_{3}^{2}$。惯性一正二负要求$a-4<0$、$b<0$；严格不等式保证无零特征值。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2025-09","revision":"R-88756b25a0a94b8b","year":2025,"original_number":9,"subject":"线性代数","chapter":"矩阵","point":"矩阵运算与方程","model":"初等变换与行等价判定","type":"选择题","original_points":5,"difficulty":2,"calculation":2,"core":"行等价判定：目标行阶梯阵","method":"各选项消元，比较行空间而非只比较秩","stem":"可经初等行变换得到$\\begin{bmatrix}1 & 1 & 0 & 1 \\\\ 0 & 0 & 1 & 2 \\\\ 0 & 0 & 0 & 0\\end{bmatrix}$的是：","options":["$\\begin{bmatrix}1 & 1 & 0 & 1 \\\\ 1 & 2 & 1 & 3 \\\\ 2 & 3 & 1 & 4\\end{bmatrix}$","$\\begin{bmatrix}1 & 1 & 0 & 1 \\\\ 1 & 1 & 2 & 5 \\\\ 1 & 1 & 1 & 3\\end{bmatrix}$","$\\begin{bmatrix}1 & 0 & 0 & 1 \\\\ 0 & 1 & 0 & 3 \\\\ 0 & 1 & 0 & 0\\end{bmatrix}$","$\\begin{bmatrix}1 & 1 & 2 & 3 \\\\ 1 & 2 & 2 & 3 \\\\ 2 & 3 & 4 & 6\\end{bmatrix}$"],"parts":[],"answer":"$B$","solution":"$B$减第一行得到$[0,0,2,4]$和$[0,0,1,2]$，化简即目标。$A$行空间含$[0,1,1,2]$不在目标行空间；$C$秩$3$；$D$行空间含$[0,1,0,0]$也不在目标行空间。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2025-10","revision":"R-ed32842a320a4761","year":2025,"original_number":10,"subject":"线性代数","chapter":"线性方程组","point":"方程组解的结构","model":"同解与公共解","type":"选择题","original_points":5,"difficulty":3,"calculation":2,"core":"矩阵乘积秩与公共解：$AB$和$BA$秩差$1$","method":"秩条件排除满秩并比较公共零空间，反例否定其余命题","stem":"$3$阶矩阵$A$、$B$满足$r(AB)=r(BA)+1$。$A.(A+B)x=0$只有零解；$B.Ax=0$、$Bx=0$均只有零解；$C.Ax=0$、$Bx=0$无公共非零解；$D.ABAx=0$、$BABx=0$有公共非零解。","options":[],"parts":[],"answer":"$D$","solution":"$A$、$B$若任一可逆则$AB$与$BA$相似，秩应相等，故均奇异且$r(AB)\\le 2$，$r(BA)\\le 1$。$r(ABA)\\le r(BA)\\le 1$，$r(BAB)\\le r(BA)\\le 1$，竖叠矩阵秩$\\le 2<3$，所以存在公共非零解。取$A$全$1$矩阵、$B$每行$(1,0,-1)$，则$AB$秩$1$、$BA=0$，且$A+B$秩$1$并有公共核，同时反驳$A$、$B$、$C$。","eligible":false,"source_body_ready":true,"render_ready":false},{"id":"EXAM-M2-2025-11","revision":"R-92d734d52ec44b97","year":2025,"original_number":11,"subject":"高等数学","chapter":"一元函数积分学","point":"反常积分","model":"含参反常积分计算","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"含参反常积分定参：有理函数积分值","method":"部分分式求无穷上限极限，解参数并检查定义域","stem":"$\\int _{1}^{\\infty }a/[x(2x+a)]dx=\\ln 2$，求$a$。","options":[],"parts":[],"answer":"$2$","solution":"若$a\\le -2$，积分端点或内部有不可积极点，不能收敛；$a>-2$时分解为$1/x-2/(2x+a)$，积分$\\ln ((2+a)/2)$。令其等$\\ln 2$得$a=2$；代回收敛且等式成立。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2025-12","revision":"R-0214143faf4d49d3","year":2025,"original_number":12,"subject":"高等数学","chapter":"函数、极限与连续","point":"函数极限与数列","model":"渐近线","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"斜渐近线：三次根式","method":"求斜率和截距，排除竖直及水平渐近线","stem":"$y=cuberoot(x^{3}-3x^{2}+1)$的渐近线方程。","options":[],"parts":[],"answer":"$y=x-1$","solution":"全实域连续，无有限竖直渐近线。$x\\to ±\\infty $，$y/x\\to 1$；$y=x\\cdot cuberoot(1-3/x+1/x^{3})$，展开括号为$1-1/x+O(x^{-2})$，故$y-x\\to -1$，左右均同一斜渐近线；无水平渐近线。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2025-13","revision":"R-6b79eff0cc78402f","year":2025,"original_number":13,"subject":"高等数学","chapter":"一元函数积分学","point":"定积分计算","model":"黎曼和与定积分定义","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"定积分定义：带对数的加权数列和","method":"整理成$x\\ln  x$的黎曼和，延拓零端点后分部积分","stem":"$\\lim _{n\\to \\infty }n^{-2}[\\ln (1/n)+2\\ln (2/n)+\\ldots +(n-1)\\ln ((n-1)/n)]$。","options":[],"parts":[],"answer":"$-\\frac{1}{4}$","solution":"写为$(1/n)\\Sigma _{i=1}^{(n-1)}(i/n)\\ln (i/n)$。$h(x)=x\\ln  x$在$0$补定义$0$后连续，可补上$i=n$的零项，黎曼和等$\\int _{0}^{1}x\\ln  x dx=-\\frac{1}{4}$；分部积分端点$x^{2}\\ln  x\\to 0$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2025-14","revision":"R-d705f37e721c45a4","year":2025,"original_number":14,"subject":"高等数学","chapter":"一元函数微分学","point":"求导运算","model":"参数曲线求导","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"参数隐式曲线求导：变上限积分条件","method":"对$t$求导定$y$及$dy/dt$，再除以$dx/dt$","stem":"$x=\\ln (1+2t)$，$2t-\\int _{1}^{y+t^{2}}e^{-u^{2}}du=0$，求$dy/dx$在$t=0$的值。","options":[],"parts":[],"answer":"$e$","solution":"积分单调严格，$t=0$给$y=1$。对$t$求导：$2=e^{-(y+t^{2})^{2}}(y_{t}+2t)$，故$y_{t}(0)=2e$；$x_{t}(0)=2$，商为$e$。$t$在$0$附近满足$1+2t>0$，参数转换合法。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2025-15","revision":"R-82a139bc4b1740d2","year":2025,"original_number":15,"subject":"高等数学","chapter":"常微分方程","point":"一阶微分方程","model":"全微分识别的一阶方程","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"全微分型一阶方程：二次齐次表达式","method":"识别恰当微分，积分后以初值选隐式曲线分支","stem":"$(2y-3x)dx+(2x-5y)dy=0$，$y(1)=1$，求解。","options":[],"parts":[],"answer":"$3x^{2}-4xy+5y^{2}=4$；初值附近$y=(2x+\\sqrt{20-11x^{2}})/5$","solution":"原式为$d(2xy-3x^{2}/2-5y^{2}/2)=0$，初值给常数$-2$，得到$3x^{2}-4xy+5y^{2}=4$。解关于$y$的二次方程，判别式$16x^{2}-20(3x^{2}-4)=80-44x^{2}$，故$y=(2x±\\sqrt{20-11x^{2}})/5$。初值$y(1)=1$选择正号，局部可导分支区间$(-\\sqrt{\\frac{20}{11}},\\sqrt{\\frac{20}{11}})$，端点$5y-2x=0$使$y' $不再有限。隐式解与$PDF$标准答案一致。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2025-16","revision":"R-ccd86f0ad51f418e","year":2025,"original_number":16,"subject":"线性代数","chapter":"线性方程组","point":"方程组解的结构","model":"基础解系与非齐次通解","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"非齐次通解：列向量关系与无关条件","method":"由列关系定基础解系维数，写特解加齐次通解","stem":"$A=(a_{1},a_{2},a_{3},a_{4})$，$a_{1},a_{2},a_{3}$线性无关，$a_{1}+a_{2}=a_{3}+a_{4}$，求$Ax=a_{1}+4a_{4}$通解。","options":[],"parts":[],"answer":"$x=(1,0,0,4)^{T}+k(1,1,-1,-1)^{T}$，$k\\in R$","solution":"秩为$3$、未知量$4$，齐次解空间维$1$；给定线性关系提供非零基础解$(1,1,-1,-1)^{T}$。特解$(1,0,0,4)^{T}$显然满足，二者相加即全部解。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2025-17","revision":"R-c1f550f5cb40469e","year":2025,"original_number":17,"subject":"高等数学","chapter":"一元函数积分学","point":"定积分计算","model":"有理函数定积分","type":"解答题","original_points":10,"difficulty":2,"calculation":2,"core":"有理函数定积分：线性因子与不可约二次因子","method":"部分分式并配成对数导数和反正切项","stem":"计算$\\int _{0}^{1} 1/[(x+1)(x^{2}-2x+2)]dx$。","options":[],"parts":[],"answer":"$3\\ln \\frac{2}{10}+\\pi /10$","solution":"分解$\\frac{1}{5}(x+1)^{-1}+(-x+3)/[5(x^{2}-2x+2)]$。原函数$\\ln (x+1)/5-\\ln (x^{2}-2x+2)/10+(\\frac{2}{5})\\arctan (x-1)$。代$0$、$1$得到$3\\ln \\frac{2}{10}+\\pi /10$，分母在区间严格正。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2025-18","revision":"R-b13a97b6e80d4ff9","year":2025,"original_number":18,"subject":"高等数学","chapter":"一元函数微分学","point":"导数定义与可导性","model":"导数定义与极限反推导数","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"极限反推可导：连续条件及二阶抵消","method":"泰勒展开已知初等项，先定$f(0)$再取定义差商","stem":"$f$在$0$连续，$\\lim _{x\\to 0}[xf(x)-e^{2\\sin  x}+1]/[\\ln (1+x)+\\ln (1-x)]=-3$。证明$f$在$0$可导并求$f' (0)$。","options":[],"parts":[],"answer":"$f(0)=2$，$f' (0)=5$","solution":"分母$=-x^{2}+o(x^{2})$，题设给分子$=3x^{2}+o(x^{2})$。$e^{2\\sin  x}=1+2x+2x^{2}+o(x^{2})$，所以$xf(x)=2x+5x^{2}+o(x^{2})$，$x\\ne 0$除$x$得$f(x)=2+5x+o(x)$。连续性确定$f(0)=2$，差商趋$5$。未假设$f$本身已有泰勒展开或可导。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2025-19","revision":"R-8fb1861b35114acf","year":2025,"original_number":19,"subject":"高等数学","chapter":"多元函数微分学","point":"多元极值与最值","model":"恢复函数后求多元极值","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"全微分恢复函数并求极值","method":"积分一个偏导，以另一偏导和初值定函数，$Hessian$分类","stem":"$f(x,y)$可微，$df=-2xe^{-y}dx+e^{-y}(x^{2}-y-1)dy$，$f(0,0)=2$，求$f$及极值。","options":[],"parts":[],"answer":"$f=(y+2-x^{2})e^{-y}$；$(0,-1)$极大值$e$，无极小值","solution":"由$f'_{x}$积分得$f=-x^{2}e^{-y}+\\varphi (y)$；对$y$求导对照得$\\varphi ' =-(y+1)e^{-y}$，$\\varphi =(y+2)e^{-y}+C$。初值给$C=0$。驻点仅$(0,-1)$，$Hessian$在此$\\operatorname{diag}(-2e,-e)$负定，极大值$e$。无其他驻点，故无极小；全平面光滑，且对固定$y$，$x=0$使$f$最大，$(y+2)e^{-y}$最大亦为$e$，故也是全局最大。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2025-20","revision":"R-410fa948312d4f8c","year":2025,"original_number":20,"subject":"高等数学","chapter":"二重积分","point":"二重积分计算","model":"极坐标二重积分","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"极坐标二重积分：两个圆相交的透镜域","method":"用交换对称性取半域，极坐标边界$r=4\\cos \\theta $积分","stem":"$D=\\{(x,y):x^{2}+y^{2}\\le 4x$，$x^{2}+y^{2}\\le 4y\\}$，计算$\\iint _{D}(x-y)^{2} dxdy$。","options":[],"parts":[],"answer":"$12\\pi -\\frac{112}{3}$","solution":"域在第一象限且关于$x=y$对称。$0\\le \\theta \\le \\pi /4$时$r\\le 4\\sin \\theta ($取两个圆盘约束的较小者)，另一半交换$x$、$y$；积分为$2\\int _{0}^{\\pi /4}\\int _{0}^{4\\sin \\theta }r^{3}(\\cos \\theta -\\sin \\theta )^{2}drd\\theta =128\\int _{0}^{\\pi /4}[\\sin ^{4}\\theta -2\\sin ^{5}\\theta \\cos \\theta ]d\\theta $。两积分分别$3\\pi /32-\\frac{1}{4}$和$\\frac{1}{24}$，故$I=12\\pi -\\frac{112}{3}>0$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2025-21","revision":"R-7605f10e82144193","year":2025,"original_number":21,"subject":"高等数学","chapter":"一元函数微分学","point":"不等式与凸性","model":"凸性与等价命题","type":"解答题","original_points":12,"difficulty":4,"calculation":2,"core":"严格凸性等价命题：导数严格递增与弦斜率","method":"充分性取极限并插入额外点保证严格；必要性用两区间中值定理","stem":"$f$在$(a,b)$内可导，证明$f' $严格递增的充要条件：任意$x_{1}<x_{2}<x_{3}$，$(f(x_{2})-f(x_{1}))/(x_{2}-x_{1})<(f(x_{3})-f(x_{2}))/(x_{3}-x_{2})$。","options":[],"parts":[],"answer":"充要条件成立","solution":"必要性：两段分别应用拉格朗日中值定理，存在$ξ_{1}\\in (x_{1},x_{2})$、$ξ_{2}\\in (x_{2},x_{3})$，斜率为$f' (ξ_{1})$、$f' (ξ_{2})$，严格递增即得不等式。充分性：记割线斜率$s(u,v)$。加权平均及题设得$s(u,v)<s(u,w)<s(v,w)(u<v<w)$。固定任意$p<q$，取$p<u<v<q$；由割线夹逼取端点极限，$f' (p)\\le s(p,u)<s(v,q)\\le f' (q)$，中间严格不等式由题设连续串联推出，故$f' (p)<f' (q)$。不要求$f'' $存在，也不把严格不等式直接取极限后误写严格。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2025-22","revision":"R-ac207a16a1c64f8a","year":2025,"original_number":22,"subject":"线性代数","chapter":"二次型","point":"标准形、规范形与惯性","model":"正交变换与二次型标准形","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"合同与正交相似区分：定参及正交矩阵","method":"先按惯性指数确定合同参数范围，再以相同特征值定正交变换","stem":"$A=\\begin{bmatrix}4 & 1 & -2 \\\\ 1 & 1 & 1 \\\\ -2 & 1 & a\\end{bmatrix}$与$B=\\operatorname{diag}(k,6,0)$合同。$(1)$求$a$及$k$范围；$(2)$若存在正交$Q$使$Q^{T}AQ=B$，求$k$及$Q$。","options":[],"parts":[],"answer":"$(1)a=4,k>0$；$(2)k=3$，$Q$的列为$(1,1,1)^{T}/\\sqrt{3}$、$(-1,0,1)^{T}/\\sqrt{2}$、$(1,-2,1)^{T}/\\sqrt{6}$","solution":"合同要求同秩，$B$有零特征值，$\\det A=3(a-4)=0$得$a=4$。此时特征值$0$、$3$、$6$，惯性二正一零，故$k>0$且均可合同；$k=0$或负不满足。正交合同也是相似，故$k=3$。对应$3$、$6$、$0$的所列向量互相正交且模分别$\\sqrt{3}$、$\\sqrt{2}$、$\\sqrt{6}$，单位化给$Q$；按列顺序对照$B$，直接$AQ=Q\\operatorname{diag}(3,6,0)$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-01","revision":"R-7a29d8b7b18348f4","year":2026,"original_number":1,"subject":"高等数学","chapter":"函数、极限与连续","point":"无穷小与泰勒展开","model":"泰勒抵消与系数匹配","type":"选择题","original_points":5,"difficulty":2,"calculation":1,"core":"等价无穷小定参：反正弦与立方根展开","method":"消去一次项后匹配二次系数","stem":"当$x\\to 0$时，$a\\cdot x^{2}+b\\cdot x+\\arcsin  x$与$(1+x^{2})^{\\frac{1}{3}}-1$是等价无穷小，则()。","options":["$a=\\frac{1}{3}$、$b=-1$","$a=\\frac{1}{3}$、$b=1$","$a=\\frac{2}{3}$、$b=-1$","$a=\\frac{2}{3}$、$b=1$"],"parts":[],"answer":"$A$；$a=\\frac{1}{3}$，$b=-1$","solution":"$\\arcsin  x=x+x^{3}/6+o(x^{3})$，$(1+x^{2})^{\\frac{1}{3}}-1=x^{2}/3+o(x^{2})$。若$b+1\\ne 0$，左式一阶项未消去，不能与二阶量等价；故$b=-1$。再比较二阶系数，$a/(\\frac{1}{3})=1$，故$a=\\frac{1}{3}$。代回两式比值趋$1$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-02","revision":"R-f1ef09b241de44bf","year":2026,"original_number":2,"subject":"高等数学","chapter":"常微分方程","point":"高阶线性微分方程","model":"线性方程解结构与叠加","type":"选择题","original_points":5,"difficulty":2,"calculation":1,"core":"非齐次解的线性组合：系数约束","method":"非齐次组合的系数和为$1$，齐次组合的系数和为$0$","stem":"$y_{1}(x)$、$y_{2}(x)$是某二阶非齐次线性微分方程的两个特解。常数$\\lambda $、$\\mu $使$2\\lambda y_{1}+\\mu y_{2}$为该非齐次方程的解，$\\lambda y_{1}-2\\mu y_{2}$为对应齐次方程的解，则()。","options":["$\\lambda =\\frac{1}{5}$、$\\mu =\\frac{2}{5}$","$\\lambda =\\frac{2}{5}$、$\\mu =\\frac{1}{5}$","$\\lambda =\\frac{1}{4}$、$\\mu =\\frac{1}{2}$","$\\lambda =\\frac{1}{2}$、$\\mu =\\frac{1}{4}$"],"parts":[],"answer":"$B$；$\\lambda =\\frac{2}{5}$，$\\mu =\\frac{1}{5}$","solution":"记线性微分算子$L$与非恒零的右端$r$，有$L[y_{1}]=L[y_{2}]=r$。条件给$(2\\lambda +\\mu )r=r$、$(\\lambda -2\\mu )r=0$，所以$2\\lambda +\\mu =1$、$\\lambda -2\\mu =0$，解得$\\lambda =\\frac{2}{5}$、$\\mu =\\frac{1}{5}$。代入两系数关系均成立；不需先求出微分方程通解。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-03","revision":"R-a3287932777c4e17","year":2026,"original_number":3,"subject":"高等数学","chapter":"多元函数微分学","point":"复合及隐函数求导","model":"隐函数偏导及全微分","type":"选择题","original_points":5,"difficulty":2,"calculation":1,"core":"隐函数偏导恒等式：指数与线性项","method":"分别隐式偏导，利用共同分母作线性组合","stem":"$z=z(x,y)$由$x-a\\cdot z=e^{y+a\\cdot z}$确定，$a$是非零常数，则()。","options":["$z_{x}-z_{y}=1/a$","$z_{x}+z_{y}=1/a$","$z_{x}-z_{y}=-1/a$","$z_{x}+z_{y}=-1/a$"],"parts":[],"answer":"$A$","solution":"记$E=e^{y+az}>0$。对$x$求偏导：$1-a z_{x}=aE z_{x}$，故$z_{x}=1/[a(1+E)]$。对$y$求偏导：$-a z_{y}=E(1+a z_{y})$，故$z_{y}=-E/[a(1+E)]$。相减得$1/a$。$a\\ne 0$和$1+E>0$保证分母非零。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-04","revision":"R-6ed2dde2a8e44017","year":2026,"original_number":4,"subject":"高等数学","chapter":"定积分应用","point":"弧长与物理几何应用","model":"做功与引力","type":"选择题","original_points":5,"difficulty":3,"calculation":1,"core":"杆引力：对称质量分布的分量积分","method":"抵消水平分量，只积分竖直方向引力","stem":"设线密度为$1$的细直棒的两个端点分别位于点$(-1,0)$和点$(1,0)$处，质量为$m$的质点位于点$(0,1)$处，$G$为引力常量，则该细直棒对该质点的引力大小为(　)。","options":["$\\displaystyle\\int_0^1\\frac{2Gmx}{(x^2+1)^{1/2}}\\,dx$","$\\displaystyle\\int_0^1\\frac{2Gm}{(x^2+1)^{1/2}}\\,dx$","$\\displaystyle\\int_0^1\\frac{2Gmx}{(x^2+1)^{3/2}}\\,dx$","$\\displaystyle\\int_0^1\\frac{2Gm}{(x^2+1)^{3/2}}\\,dx$"],"parts":[],"answer":"$D$；大小为$\\sqrt{2}\\cdot G\\cdot m$","solution":"坐标$x$处质量微元$dm=dx$，至质点距离$r=\\sqrt{1+x^{2}}$，引力微元大小$Gm dx/(1+x^{2})$。关于$y$轴对称的两微元水平分量抵消，竖直分量需再乘$1/r$，因此总大小$2Gm\\int _{0}^{1}(1+x^{2})^{-\\frac{3}{2}}dx$。原函数$x/\\sqrt{1+x^{2}}$，积分值$1/\\sqrt{2}$，总大小$\\sqrt{2} Gm$，方向向下。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-05","revision":"R-3a3a7cd098be47f6","year":2026,"original_number":5,"subject":"高等数学","chapter":"一元函数微分学","point":"不等式与凸性","model":"凸性与等价命题","type":"选择题","original_points":5,"difficulty":3,"calculation":2,"core":"凸性与极值命题：端点弦斜率的单调性","method":"凸性定义证明充分命题，缺连续性和必要性以反例检验","stem":"$f$在$[-1,1]$有定义，则下列正确的是()。","options":["$f$在$(-1,0)$单调递减、在$(0,1)$单调递增时，$f(0)$是极小值","$f(0)$是极小值时，$f$在$(-1,0)$单调递减、在$(0,1)$单调递增","$f$图形在$[-1,1]$是凹的时，$(f(x)-f(1))/(x-1)$在$[-1,1)$单调递增","$(f(x)-f(1))/(x-1)$在$[-1,1)$单调递增时，$f$图形在$[-1,1]$是凹的。凹性沿用原题的弦线定义"],"parts":[],"answer":"$C$","solution":"$A$未给$0$处连续性：令$f(x)=|x|(x\\ne 0)$，$f(0)=2$，左右单调条件成立但$0$非极小点。$B$可用$f(x)=-\\cos (10x)$反驳：$0$处为局部极小，两个给定全区间内却非单调。$C$取$-1\\le x_{1}<x_{2}<1$，$\\lambda =(x_{2}-x_{1})/(1-x_{1})\\in (0,1)$，由原题凹性弦线性质$f(x_{2})<\\lambda  f(1)+(1-\\lambda )f(x_{1})$。减$f(1)$并除负数$x_{2}-1$，得$[f(x_{2})-f(1)]/(x_{2}-1)>[f(x_{1})-f(1)]/(x_{1}-1)$，故$C$。$D$令$f=x^{3}+x^{2}-2x$，则$f(1)=0$，差商$=x^{2}+2x$在$[-1,1)$递增，但$f'' =6x+2$在$-\\frac{1}{3}$变号，图形非全区间凹。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-06","revision":"R-e4bb3281ef8d41ac","year":2026,"original_number":6,"subject":"高等数学","chapter":"一元函数微分学","point":"求导运算","model":"反函数求导","type":"选择题","original_points":5,"difficulty":2,"calculation":1,"core":"反函数求导：复合上限积分定义原函数","method":"先定反函数值，再用反函数导数与变上限链式导数","stem":"$f(x)=\\int _{1}^{x^{3}} e^{t}/(1+t^{2})dt$，反函数为$g$，则()。","options":["$g(0)=1$、$g' (0)=3e/2$","$g(0)=1$、$g' (0)=2/(3e)$","$g(1)=0$、$g' (1)=3e/2$","$g(1)=0$、$g' (1)=2/(3e)$"],"parts":[],"answer":"$B$","solution":"被积函数正，积分函数对上限严格增加，$x^{3}$也严格增加，所以$f$可逆。$f(1)=0$，故$g(0)=1$。变上限链式求导给$f' (x)=3x^{2} e^{x^{3}}/(1+x^{6})$，$f' (1)=3e/2\\ne 0$，反函数求导$g' (0)=1/f' (1)=2/(3e)$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-07","revision":"R-147a4eeb447043d9","year":2026,"original_number":7,"subject":"高等数学","chapter":"二重积分","point":"对称性与积分定义","model":"二重积分黎曼和与对称补域","type":"选择题","original_points":5,"difficulty":3,"calculation":2,"core":"对称二重积分的黎曼和：半方域与权重","method":"识别两个网格步长和取样范围，交换对称性补全正方形","stem":"$f$在$D=\\{(x,y):0\\le x\\le 1$，$0\\le y\\le 1\\}$连续且$f(x,y)=f(y,x)$。$\\iint _{D} f(x,y)dxdy$等于()。","options":["$2\\lim _{n\\to \\infty }\\Sigma _{i=1}^{n}\\Sigma _{j=n+1-i}^{n} f(i/n,j/n)/n^{2}$","$(\\frac{1}{2})\\lim _{n\\to \\infty }\\Sigma _{i=1}^{n}\\Sigma _{j=1}^{n} f(i/n,j/n)/n^{2}$","$2\\lim _{n\\to \\infty }\\Sigma _{i=1}^{2n}\\Sigma _{j=1}^{2n+1-i} f(i/(2n),j/(2n))/n^{2}$","$(\\frac{1}{2})\\lim _{n\\to \\infty }\\Sigma _{i=1}^{2n}\\Sigma _{j=1}^{i} f(i/(2n),j/(2n))/n^{2}$"],"parts":[],"answer":"$D$","solution":"$D$的两个步长均$1/(2n)$，矩形面积$1/(4n^{2})$，题给系数$(\\frac{1}{2})/n^{2}$是其$2$倍。采样区域趋于$0\\le y\\le x\\le 1$，故$D=2\\int _{0}^{1}dx\\int _{0}^{x} f(x,y)dy$。坐标互换对称性把两半正方形积分相等化，故等于全域积分；对角线及边界采样差的贡献随$n$趋$0$。$B$是全域积分的$\\frac{1}{2}$；$C$权重与前系数合计为正确网格面积的$8$倍，其三角域$x+y\\le 1$虽关于坐标交换对称，但不一定是全域积分一半，不能用这种对称性补全。$A$也按$x+y\\ge 1$取域，不能由$x$、$y$互换得到另一半；例如$f=x+y$，全域积分$1$，而$A$为$\\frac{4}{3}$。只有$D$恒成立。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-08","revision":"R-16e32a00d9374b17","year":2026,"original_number":8,"subject":"线性代数","chapter":"矩阵","point":"矩阵运算与方程","model":"置换矩阵及求逆","type":"选择题","original_points":5,"difficulty":2,"calculation":1,"core":"置换矩阵：单位阵行交换乘积","method":"将多次交换写成置换矩阵乘积，求逆仍为置换矩阵","stem":"单位矩阵经若干次互换两行所得矩阵称置换矩阵。$A$为$n$阶置换矩阵，$A^{*}$为伴随矩阵，则()。","options":["$A^{*}$为置换矩阵","$A^{(-1)}$为置换矩阵","$A^{(-1)}=A^{*}$","$A^{(-1)}=-A^{*}$"],"parts":[],"answer":"$B$","solution":"$A$是若干互换两行初等矩阵的乘积，各因子的逆仍为自身，反序乘积$A^{(-1)}$也是置换矩阵。$\\det  A=±1$，$A^{*}=\\det (A) A^{(-1)}$，所以$C$只在$\\det  A=1$时成立，$D$只在$\\det  A=-1$时成立；$\\det  A=-1$时$A^{*}$有负的非零元素，不是置换矩阵，$A$不恒真。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-09","revision":"R-807c75a16fdd4aa8","year":2026,"original_number":9,"subject":"线性代数","chapter":"线性方程组","point":"方程组解的结构","model":"参数方程组与矩阵方程可解性","type":"选择题","original_points":5,"difficulty":3,"calculation":2,"core":"矩阵方程$AB=C$有解定参","method":"逐列求解等价于增广矩阵与$A$同秩，消元约束参数","stem":"$A=\\begin{bmatrix}1 & 0 & 1 \\\\ 0 & 0 & 1 \\\\ 1 & 1 & 3 \\\\ 1 & 1 & 1\\end{bmatrix}$，$C=\\begin{bmatrix}2 & 0 \\\\ 1 & 1 \\\\ 1 & 1 \\\\ a & b\\end{bmatrix}$。若存在$B$使$AB=C$，则()。","options":["$a=-1$、$b=-1$","$a=2$、$b=2$","$a=-1$、$b=2$","$a=2$、$b=-1$"],"parts":[],"answer":"$A$；$a=b=-1$","solution":"$A$的第$4$行等于第$3$行减$2$倍第$2$行，$AB$各行也必须有同一关系，所以$C$第$4$行$=(1,1)-2(1,1)=(-1,-1)$，必要。取$B=\\begin{bmatrix}1 & -1 \\\\ -3 & -1 \\\\ 1 & 1\\end{bmatrix}$可直接验证$AB=C(a=b=-1)$，故充分；得到$A$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-10","revision":"R-89bc32b874734e71","year":2026,"original_number":10,"subject":"线性代数","chapter":"特征值与相似","point":"特征值与特征向量","model":"矩阵多项式的谱","type":"选择题","original_points":5,"difficulty":3,"calculation":1,"core":"平方零矩阵：谱与特征子空间维数","method":"从$(A-B)$平方为零定全零谱，秩不等式给核维数","stem":"$3$阶矩阵$A$、$B$满足$AB+BA=A^{2}+B^{2}$且$A\\ne B$。下列错误的是()。$A.(A-B)^{3}=O$；$B.A-B$只有零特征值；$C.A$、$B$不能都是对角矩阵；$D.A-B$只有一个线性无关特征向量。","options":[],"parts":[],"answer":"$D$；$A-B$的特征空间维数为$2$","solution":"令$N=A-B$。原式等价$N^{2}=O$，因此$N^{3}=O$，所有特征值$\\lambda $满足$\\lambda ^{2}=0$，$A$、$B$项真。$N\\ne O$；若$A$、$B$同时为对角矩阵，则$N$为对角阵，$N^{2}=0$会推出$N=0$，矛盾，所以$C$真。因像空间包含在零空间内，$\\operatorname{rank} N\\le 3-\\operatorname{rank} N$，且$\\operatorname{rank} N\\ge 1$，得$\\operatorname{rank} N=1$，$dim ker N=2$。全部特征向量属于$ker N$，因此有两个线性无关特征向量，$D$错误。未假定$AB=BA$。","eligible":false,"source_body_ready":true,"render_ready":false},{"id":"EXAM-M2-2026-11","revision":"R-ccdb8e12da1b401f","year":2026,"original_number":11,"subject":"高等数学","chapter":"一元函数积分学","point":"反常积分","model":"反常积分收敛判别","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"反常积分判敛：反正切与两端幂函数","method":"分别在$0$和无穷远作等价比较，合并参数范围","stem":"$p$为常数，若$\\int _{0}^{+\\infty } [\\arctan  x]/[x^{p}(x+1)]dx$收敛，求$p$的范围。","options":[],"parts":[],"answer":"$0<p<2$","solution":"必须同时检验$0$和$\\infty $。$x\\to 0+$时被积函数$~x^{1-p}$，近$0$可积当且仅当$1-p>-1$，即$p<2$。$x\\to \\infty $时被积函数$~(\\pi /2)x^{-p-1}$，无穷远可积当且仅当$p+1>1$，即$p>0$。被积函数正，可用极限比较，合并得$0<p<2$。端点$p=0$或$2$均有对数型发散。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-12","revision":"R-d3327a3f720a4fe7","year":2026,"original_number":12,"subject":"高等数学","chapter":"函数、极限与连续","point":"无穷小与泰勒展开","model":"泰勒抵消求极限","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"相减型极限：对数正弦的二阶抵消","method":"通分后展开分子到二阶","stem":"求$\\lim _{x\\to 0}[1/x-\\ln (1+x)/(x \\sin  x)]$。","options":[],"parts":[],"answer":"$\\frac{1}{2}$","solution":"先通分为$[\\sin  x-\\ln (1+x)]/(x \\sin  x)$，不能将两项各自求发散极限再相减。$\\sin  x=x+o(x^{2})$，$\\ln (1+x)=x-x^{2}/2+o(x^{2})$，分子$=x^{2}/2+o(x^{2})$，分母$~x^{2}$，故极限$\\frac{1}{2}$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-13","revision":"R-111d8954e67e44b1","year":2026,"original_number":13,"subject":"高等数学","chapter":"一元函数微分学","point":"切线、法线与曲率","model":"曲率与曲率圆","type":"填空题","original_points":5,"difficulty":2,"calculation":2,"core":"曲率半径：倾斜双曲线隐式曲线","method":"隐式求一二阶导，代曲率公式再取倒数","stem":"曲线$x^{2}+2\\sqrt{3}xy+y^{2}=1$在$(0,1)$处的曲率半径为$\\underline{\\qquad\\qquad}$。","options":[],"parts":[],"answer":"$4$","solution":"$F_{y}$在$(0,1)$为$2$，隐函数可用。一次求导$2x+2\\sqrt{3} y+2\\sqrt{3} x y' +2yy' =0$，代点得$y' =-\\sqrt{3}$。二次求导$2+4\\sqrt{3} y' +2\\sqrt{3} x y'' +2(y' )^{2}+2yy'' =0$，代点得$y'' =2$。曲率$κ=|2|/(1+3)^{\\frac{3}{2}}=\\frac{1}{4}$，半径$4$。曲线二次型特征值$1±\\sqrt{3}$异号，实际为双曲线，计算无需误称椭圆。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-14","revision":"R-3b7e7424c0d74ae9","year":2026,"original_number":14,"subject":"高等数学","chapter":"多元函数微分学","point":"复合及隐函数求导","model":"复合函数一二阶偏导","type":"填空题","original_points":5,"difficulty":1,"calculation":1,"core":"复合函数导数：全微分给定梯度","method":"读出偏导值并代链式求导","stem":"$f(x,y)$可微且$df(0,0)=\\pi  dx+3dy$。$g(x)=f(\\ln  x,\\sin (\\pi x))$，求$g' (1)$。","options":[],"parts":[],"answer":"$-2\\pi $","solution":"由全微分读出$f_{x}(0,0)=\\pi $、$f_{y}(0,0)=3$。$x=1$时内变量为$(0,0)$，内导数分别为$1$与$\\pi \\cos \\pi =-\\pi $。链式法则得$g' (1)=\\pi \\cdot 1+3\\cdot (-\\pi )=-2\\pi $。可微性足以使用该复合求导，未额外假定偏导连续。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-15","revision":"R-6a8302e3fa0942b7","year":2026,"original_number":15,"subject":"高等数学","chapter":"一元函数积分学","point":"积分性质、平均值与不等式","model":"函数平均值","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"积分平均值：对数函数","method":"积分除以区间长度，分部或直接原函数计算","stem":"$f(x)=\\ln (2+x)$在$[0,2]$上的平均值为$\\underline{\\qquad\\qquad}$。","options":[],"parts":[],"answer":"$3\\ln 2-1$","solution":"平均值$=(\\frac{1}{2})\\int _{0}^{2}\\ln (2+x)dx$。原函数$(2+x)\\ln (2+x)-(2+x)$，端点差$=4\\ln 4-4-(2\\ln 2-2)=6\\ln 2-2$，除区间长度$2$得到$3\\ln 2-1$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-16","revision":"R-9f0ed174410c4b6a","year":2026,"original_number":16,"subject":"线性代数","chapter":"二次型","point":"标准形、规范形与惯性","model":"惯性指数与规范形定参","type":"填空题","original_points":5,"difficulty":2,"calculation":1,"core":"规范形与秩：$AA$转置的平方和矩阵","method":"正半定且规范形秩$1$，转为$A$两行成比例定参","stem":"$A=\\begin{bmatrix}1 & b & -1 \\\\ a+2 & 3 & -3a\\end{bmatrix}$。二次型$x^{T}(AA^{T})x$的规范形为$y_{1}^{2}$，求$a+b$。","options":[],"parts":[],"answer":"$2$；$a=b=1$","solution":"$AA^{T}$为实正半定矩阵；规范形恰一正平方项给$\\operatorname{rank}(AA^{T})=1$，且$\\operatorname{rank}(AA^{T})=\\operatorname{rank} A$，所以$A$秩$1$。第一行非零，第二行必为其$k$倍。比较第$1$、$3$列得$k=a+2=3a$，因此$a=1$、$k=3$；第$2$列给$3=3b$，所以$b=1$。反代$A$第二行为第一行$3$倍，$\\operatorname{rank} A=1$且$AA^{T}$正半定，确实有题给规范形；$a+b=2$。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-17","revision":"R-13a0a455ea824af1","year":2026,"original_number":17,"subject":"高等数学","chapter":"二重积分","point":"二重积分计算","model":"极坐标二重积分","type":"解答题","original_points":10,"difficulty":3,"calculation":2,"core":"极坐标二重积分：圆扇域的径向三角函数","method":"写角区间$\\pi /4$至$3\\pi /4$，分离角度后分部积分径向","stem":"计算$I=\\int _{-1}^{1} dx \\int _{|x|}^{\\sqrt{2-x^{2}}} y \\sin (\\sqrt{x^{2}+y^{2}})dy$。","options":[],"parts":[],"answer":"$4\\sin (\\sqrt{2})-2\\sqrt{2}$","solution":"积分域为圆$x^{2}+y^{2}\\le 2$中$y\\ge |x|$的上扇形。极坐标$\\theta \\in [\\pi /4,3\\pi /4]$、$r\\in [0,\\sqrt{2}]$，$y=r \\sin \\theta $，面积微元$rdrd\\theta $，$I=\\int \\sin \\theta  d\\theta \\int r^{2} \\sin  r dr$。角积分$\\sqrt{2}$；径向原函数$-r^{2}\\cos  r+2r \\sin  r+2\\cos  r$，端点差$2\\sqrt{2} \\sin (\\sqrt{2})-2$。相乘得$4\\sin (\\sqrt{2})-2\\sqrt{2}$。注意$r^{2}$的两个来源：$y$和雅可比。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-18","revision":"R-004453b9420c4ab9","year":2026,"original_number":18,"subject":"高等数学","chapter":"一元函数积分学","point":"变上限及含参积分","model":"变上限积分求导与导函数连续性","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"含参上限积分求导与零点连续性","method":"换元改写为变上限积分除以$x$；零点单独用定义与积分估计","stem":"$g(x)$连续，$f(x)=\\int _{0}^{x^{2}}g(xt)dt$。求$f' (x)$表达式，并判断$f' $在$x=0$处的连续性。","options":[],"parts":[],"answer":"$f' (x)=3x\\cdot g(x^{3})-x^{(-2)}\\int _{0}^{x^{3}}g(u)du(x\\ne 0)$；$f' (0)=0$；$f' $在$0$连续","solution":"$x\\ne 0$时令$u=xt$，得到$f(x)=G(x^{3})/x$，其中$G(v)=\\int _{0}^{v} g(u)du$，负$x$时有向积分同样适用。由连续性$G' =g$，所以$f' =3x g(x^{3})-G(x^{3})/x^{2}$。原式$f(0)=0$。取$0$附近$|g|\\le M$，则$|G(x^{3})|\\le M|x|^{3}$，故$|f(x)/x|\\le M|x|\\to 0$，按定义$f' (0)=0$。再用$|3x g(x^{3})-G(x^{3})/x^{2}|\\le 4M|x|\\to 0$，得$f' $在$0$连续。整个证明只用$g$连续，不在积分号下对$g(xt)$求导，不补加$g' $存在。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-19","revision":"R-cb7238c2a663457b","year":2026,"original_number":19,"subject":"高等数学","chapter":"多元函数微分学","point":"多元极值与最值","model":"无约束多元极值","type":"解答题","original_points":12,"difficulty":2,"calculation":1,"core":"多元极值：二次多项式乘指数","method":"解两个驻点，$Hessian$区分鞍点与极大点","stem":"求$f(x,y)=(2x^{2}-y^{2})e^{x}$的极值。","options":[],"parts":[],"answer":"在$(-2,0)$取得局部极大值$8e^{(-2)}$；无极小值；$(0,0)$为鞍点","solution":"$f_{x}=e^{x}(2x^{2}+4x-y^{2})$，$f_{y}=-2y e^{x}$，驻点为$(0,0)$、$(-2,0)$。二阶偏导$f_{x}x=e^{x}(2x^{2}+8x+4-y^{2})$，$f_{x}y=-2y e^{x}$，$f_{y}y=-2e^{x}$。$(0,0)$的$Hessian$为$\\operatorname{diag}(4,-2)$，为鞍点；$(-2,0)$的$Hessian$为$\\operatorname{diag}(-4e^{-2},-2e^{-2})$，负定，故局部极大值$8e^{-2}$。无其他驻点，可微全平面上无极小值。沿$y=0$、$x\\to \\infty $函数无界增大，不能把该局部极大值称为全局最大值。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-20","revision":"R-876b1be4c63b4a71","year":2026,"original_number":20,"subject":"高等数学","chapter":"定积分应用","point":"旋转体体积","model":"拐点定位与反常圆盘体积","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"旋转体积：拐点连线及无界曲线","method":"先求拐点，分锥体和反常圆盘积分，三角换元","stem":"$M(x_{0},y_{0})$为$y=1/(1+x^{2})(x\\ge 0)$的拐点，$O$为原点。$D$是第一象限中由曲线$y=1/(1+x^{2})(x\\ge x_{0})$、线段$OM$及$x$轴正半轴围成的无界区域。求$D$绕$x$轴旋转所得体积。","options":[],"parts":[],"answer":"$\\pi ^{2}/6-\\sqrt{3}\\cdot \\pi /16$","solution":"$y' =-2x/(1+x^{2})^{2}$，$y'' =(6x^{2}-2)/(1+x^{2})^{3}$，在$x_{0}=1/\\sqrt{3}$两侧变号，$y_{0}=\\frac{3}{4}$。$OM$为$y=(3\\sqrt{3}/4)x$。$0$至$x_{0}$旋转成底半径$\\frac{3}{4}$、高$1/\\sqrt{3}$的圆锥，体积$\\pi \\sqrt{3}/16$；$x_{0}$至$\\infty $用反常圆盘积分$\\pi \\int _{1/\\sqrt{3}}^{\\infty }(1+x^{2})^{(-2)}dx$。原函数$(\\frac{1}{2})[\\arctan  x+x/(1+x^{2})]$，端点差$\\pi /6-\\sqrt{3}/8$，故总体积$\\pi \\sqrt{3}/16+\\pi ^{2}/6-\\pi \\sqrt{3}/8=\\pi ^{2}/6-\\pi \\sqrt{3}/16$。尾部比较$x^{-4}$保证体积收敛。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-21","revision":"R-562d15845ce24400","year":2026,"original_number":21,"subject":"高等数学","chapter":"常微分方程","point":"非线性高阶方程降阶","model":"不显含y的二阶方程降阶","type":"解答题","original_points":12,"difficulty":3,"calculation":2,"core":"非线性二阶方程降阶：不显含$y$","method":"置$p=y$导数，再置$u=p/x$化分离变量，初值定解并积分","stem":"求$x^{2}y'' -2xy' -(y' )^{2}=0(x>2)$满足$y(3)=\\frac{1}{2}$、$y' (3)=-9$的解。","options":[],"parts":[],"answer":"$y(x)=-x^{2}/2-2x-4\\ln (x-2)+11$，$x>2$","solution":"令$p=y' $，得$x^{2}p' -2xp-p^{2}=0$。再令$u=p/x$，化为$xu' =u(u+1)$。初值$u(3)=-3$，不属于$u=0$、$-1$两条常值分支。分离积分$\\ln |u/(u+1)|=\\ln  x+C$，初值所在分支给$u/(u+1)=x/2$，故$u=x/(2-x)$、$p=x^{2}/(2-x)$。积分$p=-x-2+4/(2-x)$，得$y=-x^{2}/2-2x-4\\ln (x-2)+C_{2}$。$y(3)=\\frac{1}{2}$给$C_{2}=11$；求导代回原方程及两个初值均成立。$x>2$中无额外极点且对数有定义，适用区间完整。","eligible":true,"source_body_ready":true,"render_ready":true},{"id":"EXAM-M2-2026-22","revision":"R-577253847f7a406c","year":2026,"original_number":22,"subject":"线性代数","chapter":"向量与矩阵秩","point":"线性关系与向量组","model":"相关性、极大无关组与线性表示","type":"解答题","original_points":12,"difficulty":4,"calculation":2,"core":"极大无关组与矩阵高次幂：低秩分解","method":"消元证明极大无关组，写$A=GH$并计算二阶$HG$的幂","stem":"$\\alpha _{1}=(1,0,-1,-1)^{T}$，$\\alpha _{2}=(1,-1,0,-2)^{T}$，$\\alpha _{3}=(0,-1,1,-1)^{T}$，$\\alpha _{4}=(0,1,-1,1)^{T}$，$A=(\\alpha _{1},\\alpha _{2},\\alpha _{3},\\alpha _{4})$，$G=(\\alpha _{1},\\alpha _{2})$。$(1)$证明$\\alpha _{1}$、$\\alpha _{2}$是四向量组的一个极大线性无关组；$(2)$求$H$使$A=GH$，并求$A^{10}$。","options":[],"parts":[],"answer":"$(1)\\alpha _{1}$、$\\alpha _{2}$无关且张成四向量；$(2)H=\\begin{bmatrix}1 & 0 & -1 & 1 \\\\ 0 & 1 & 1 & -1\\end{bmatrix}$；$A^{10}=\\begin{bmatrix}1 & -8 & -9 & 9 \\\\ 0 & -1 & -1 & 1 \\\\ -1 & 9 & 10 & -10 \\\\ -1 & 7 & 8 & -8\\end{bmatrix}$","solution":"$\\alpha _{1}$、$\\alpha _{2}$的前两分量组成行列式$-1$的$2$阶矩阵，故无关。直接得到$\\alpha _{3}=-\\alpha _{1}+\\alpha _{2}$、$\\alpha _{4}=\\alpha _{1}-\\alpha _{2}$，所以两向量张成原组，为极大无关组；相应系数逐列给$H$。因$A=GH$，归纳$A^{k}=G(HG)^{k-1}H(k\\ge 1)$。$HG=\\begin{bmatrix}1 & -1 \\\\ 0 & 1\\end{bmatrix}=E+N$，$N^{2}=0$，所以$(HG)^{9}=E+9N=\\begin{bmatrix}1 & -9 \\\\ 0 & 1\\end{bmatrix}$。$G(HG)^{9}=\\begin{bmatrix}1 & -8 \\\\ 0 & -1 \\\\ -1 & 9 \\\\ -1 & 7\\end{bmatrix}$，再乘$H$即所列$A^{10}$。无需对$4$阶矩阵做十次普通乘法。","eligible":true,"source_body_ready":true,"render_ready":true}],"insights":{"EXAM-M2-2022-17":{"revision":"R-8a29e6085f6649cc","family":"利用已知可导性求导数","conditions":"基点可导，给出两个复合自变量构成的差商极限。","objective":"确定基点的一阶导数。","decision":"先用有限极限确定基点函数值，再把两个自变量的增量换成同一尺度。","difficultyReason":"有两个前后相接的判断：常数项必须消失，随后才能比较增量系数。计算短，但不是直接代入导数公式。","pitfall":"忽略基点函数值，或把两个自变量当成相同增量而漏掉组合系数。","selection":"用于考查极限条件的拆解与可导展开，可与常规求导任务区别开。"},"EXAM-M2-2024-02":{"revision":"R-6487e115c1cb4732","family":"利用已知可导性求导数","conditions":"函数由参数方程给出，极限的外层变量趋于无穷。","objective":"计算基点附近差商的极限。","decision":"先识别函数自变量趋于哪个基点，找到对应参数，再计算导数及增量倍数。","difficultyReason":"识别差商后只需参数求导和一个倍数转换，属于标准短链；无穷远写法不自动增加证明难度。","pitfall":"把外层变量趋于无穷误认为函数要在无穷处求导，或漏乘增量倍数。","selection":"适合作为考查差商识别的短任务，不宜仅凭参数方程外观提高难度。"},"EXAM-M2-2025-18":{"revision":"R-b13a97b6e80d4ff9","family":"由极限证明可导","conditions":"只给基点连续性和含函数值的相减型极限，没有预先给可导性。","objective":"证明基点可导，再求导数。","decision":"展开已知的初等函数，从极限反推出待求函数的线性近似；连续性用于确定基点值。","difficultyReason":"需要补足“导数存在”的论证，不能只算出一个形式上的系数；二阶抵消与连续性需要衔接。","pitfall":"为待求函数直接写泰勒展开，相当于提前假设了要证明的可导性。","selection":"适合区分“已经可导后求导数”与“先证明可导”的解答任务。"},"EXAM-M2-2022-03":{"revision":"R-01644a9ed32640da","family":"辨析导数条件的推论","conditions":"只在指定点存在二阶导数，选项涉及邻域单调性和凹凸性。","objective":"判断哪些局部性质能够从给定条件推出。","decision":"区分导函数在点连续与二阶导在邻域保持符号；不同结论要求的条件不同。","difficultyReason":"主要负担是必要条件、充分条件和邻域范围的辨析，计算量低也能形成中等难度。","pitfall":"从一点二阶导为正直接推出整个邻域凹凸性，或把递增的必要导数条件写成严格大于零。","selection":"用于概念判断；与求驻点、解参数范围的题目共用导数知识，但任务不同。"},"EXAM-M2-2023-07":{"revision":"R-9d56f01132ac4f0c","family":"用变号条件确定参数","conditions":"含参显式函数，同时要求没有极值而存在拐点。","objective":"确定参数范围，正确处理区间端点。","decision":"分别检验一阶导与二阶导是否变号，再合并两个参数条件。","difficultyReason":"需要同时处理两个判据和退化端点；二次式判别后还要检查零点是否真的变号。","pitfall":"导数等于零就认定极值，或把偶重的二阶导零点误判为拐点。","selection":"适合检验条件合取和边界处理，不宜与另一道同样的双判据定参题机械重复。"},"EXAM-M2-2025-02":{"revision":"R-5b5f11e26c074f59","family":"判断指定点的局部性态","conditions":"两种函数包含变上限积分，其中一种再乘   function questionBody(q){
    if(!q.eligible||!q.source_body_ready||!q.render_ready)return '<p class="pending">正文待核验。</p>';
    return `<div class="question-stem">${math(q.stem)}${q.parts?.length?`<ol class="question-parts">${q.parts.map(p=>`<li>${math(p)}</li>`).join('')}</ol>`:''}</div>${q.options?.length?`<div class="question-options">${q.options.map((o,i)=>`<div class="question-option"><b>${'ABCD'[i]}.</b>${math(o)}</div>`).join('')}</div>`:''}`;
  }
  function questionReader(q){
    if(!q)return '<div class="empty-state">请选择一道真题。</div>';
    const idea=insight(q),fields=idea?`<dl><div><dt>考查任务</dt><dd>${esc(idea.objective)}</dd></div><div><dt>关键判断</dt><dd class="analysis-decision">${esc(idea.decision)}</dd></div><div><dt>容易忽略的条件</dt><dd>${esc(idea.pitfall)}</dd></div></dl>`:`<dl><div><dt>考查任务</dt><dd>${math(q.core||'暂未记录')}</dd></div><div><dt>主要解法</dt><dd>${math(q.method||'暂未记录')}</dd></div></dl>`;
    return `<article class="question-reader"><header class="reader-heading"><div><h3>${q.year}年 · 第${num(q.original_number)}题</h3><p class="reader-meta">${esc(q.type)} · ${num(q.original_points)}分 · ${esc(q.point)}</p></div></header><div class="reader-layout"><section>${questionBody(q)}</section><section class="analysis-body"><h4>${idea?'解题与命题分析':'题目索引'}</h4>${fields}</section></div><div class="ratings"><span class="rating-label">难度 ${difficulty(q)}</span><span class="rating-label">计算量 ${cost(q)}</span></div>${q.eligible?`<details class="solution"><summary>标准答案与已有解答</summary><div>${math(q.answer)}</div><div>${math(q.solution)}</div></details>`:''}${idea?`<section class="topic-selection"><h4>命题启发</h4><p>${esc(idea.selection)}</p></section>`:''}</article>`;
  }
  function groups(){const map=new Map();for(const q of scoped()){if(!map.has(q.model))map.set(q.model,[]);map.get(q.model).push(q);}return map;}
  function navigation(){
    const map=groups(),selectedChapter=map.get(state.topic)?.[0]?.chapter,expanded=new Set([...root.querySelectorAll('.catalogue details[open]')].map(el=>el.dataset.catalogueChapter));
    return `<aside class="topic-navigation" aria-label="考法目录"><h3 class="navigation-heading">全部考法</h3><p class="catalogue-count">${map.size}类 · ${scoped().length}道真题</p><div class="catalogue">${chapterOrder.map(ch=>{const models=[...map].filter(([,qs])=>qs[0].chapter===ch).sort((a,b)=>b[1].length-a[1].length);return models.length?`<details data-catalogue-chapter="${esc(ch)}" ${ch===selectedChapter||expanded.has(ch)?'open':''}><summary>${esc(ch)}<span>${models.reduce((n,[,qs])=>n+qs.length,0)}题</span></summary>${models.map(([name,qs])=>`<button type="button" class="cursor-interaction" data-topic="${esc(name)}" aria-pressed="${state.topic===name}"><span>${esc(name)}</span><span class="catalogue-quantity">${qs.length}题</span></button>`).join('')}</details>`:'';}).join('')}</div></aside>`;
  }
  function renderTopic(){
    let rows=topicRows();if(!rows.length){const first=scoped()[0];if(first){state.topic=first.model;rows=topicRows();}}if(!rows.length)return '<p class="empty-state">没有对应真题。</p>';
    if(!rows.some(q=>q.id===state.question))state.question=(rows.find(q=>insight(q))||rows.find(q=>q.eligible)||rows[0]).id;
    const q=rowById(state.question),overview=DATA.topics[state.topic],years=new Set(rows.map(q=>q.year));
    const focus=overview?`<section class="research-focus"><p>${esc(overview.focus)}</p><div class="dimensions">${overview.decisions.map(d=>`<span>${esc(d)}</span>`).join('')}</div></section>`:'';
    return `<div class="topic-shell">${navigation()}<section class="topic-workspace"><p class="breadcrumb">${esc(rows[0].subject)} ／ ${esc(rows[0].chapter)}</p><h2>${esc(topicNames[state.topic]||state.topic)}</h2><p class="topic-meta">${rows.length}道真题 · 覆盖${years.size}年 · 累计${num(points(rows))}分</p>${focus}<div class="question-switcher" aria-label="对应真题">${rows.map(r=>`<button type="button" class="cursor-interaction" data-question="${esc(r.id)}" aria-pressed="${r.id===state.question}">${r.year} · 第${num(r.original_number)}题<span>${esc(r.type)} · ${num(r.original_points)}分</span></button>`).join('')}</div>${questionReader(q)}<div class="year-presence" aria-label="该考法在当前范围内的出现年份"><span>出现年份</span>${[...years].sort((a,b)=>a-b).map(y=>`<span class="presence">${y}</span>`).join('')}</div>${overview?`<section class="topic-selection"><h4>考法与任务差异</h4><p>${esc(overview.selection)}</p></section>`:''}</section></div>`;
  }
  function currentYears(){return [...new Set(scoped().map(q=>q.year))].sort((a,b)=>b-a);}
  function ensureYear(){const years=currentYears();if(!years.includes(state.year))state.year=years[0];return years;}
  function yearPicker(){return `<label class="scope-label">年份<select id="paper-year" aria-label="选择真题年份">${currentYears().map(y=>`<option value="${y}" ${y===state.year?'selected':''}>${y}年</option>`).join('')}</select></label>`;}
  function chapterDistribution(rows){
    const groups=[...new Set(rows.map(q=>q.chapter))].map(name=>({name,rows:rows.filter(q=>q.chapter===name)}));
    const ceiling=Math.ceil(Math.max(...groups.map(g=>points(g.rows)))/5)*5,total=points(rows);
    return `<section class="chapter-distribution"><h3>本卷考点分值</h3><div class="chapter-facets">${['高等数学','线性代数'].map(subject=>`<figure class="chapter-facet" aria-label="${subject}章节分值分布"><figcaption>${subject} · ${points(rows.filter(q=>q.subject===subject))}分</figcaption><div class="chapter-axis" aria-hidden="true"><span>0</span><span>${ceiling}分</span></div>${groups.filter(g=>g.rows[0].subject===subject).sort((a,b)=>points(b.rows)-points(a.rows)).map(g=>{const marks=points(g.rows),share=(marks/total*100).toFixed(1),label=`${g.name}，${g.rows.length}题，${marks}分，占本卷${share}%`;return `<button type="button" class="chapter-bar cursor-interaction" data-chapter="${esc(g.name)}" aria-pressed="${state.yearChapter===g.name}" aria-label="${esc(label)}" data-tooltip="${esc(label)}"><span>${esc(g.name)}</span><span class="chapter-track" aria-hidden="true"><span class="chapter-fill" style="width:${marks/ceiling*100}%"></span></span><span class="chapter-value">${marks}分<small>${share}%</small></span></button>`;}).join('')}</figure>`).join('')}</div></section>`;
  }
  function outlineProfile(rows,key){
    const ps=parts(rows,key),total=points(rows),description=ps.map(b=>`${b.short}${b.points}分、${b.count}题`).join('；');
    return `<section class="outline-profile"><h4>${key==='difficulty'?'难度':'计算量'} · ${total}分</h4><div class="outline-mix" role="img" aria-label="${esc(description)}">${ps.filter(b=>b.points>0).map(b=>`<span class="${b.cls}" style="width:${b.points/total*100}%" aria-hidden="true">${b.points/total>=.16?num(b.points):''}</span>`).join('')}</div><div class="chart-legend">${ps.map(b=>`<span><i class="chart-swatch ${b.cls}" aria-hidden="true"></i>${b.short} ${b.points}分</span>`).join('')}</div></section>`;
  }
  function renderPaper(){
    ensureYear();const rows=scoped().filter(q=>q.year===state.year).sort((a,b)=>a.original_number-b.original_number);
    if(state.yearChapter&&!rows.some(q=>q.chapter===state.yearChapter))state.yearChapter='';
    const items=rows.filter(q=>state.yearChapter?q.chapter===state.yearChapter:q.type===state.outlineType),total=points(rows);
    const selected=items.find(q=>q.id===state.outlineQuestion)||items[0];state.outlineQuestion=selected.id;
    const overviewOpen=root.querySelector('.paper-overview')?.open||false;
    const listTitle=state.yearChapter||`${state.outlineType} · 第${items[0].original_number}—${items[items.length-1].original_number}题`;
    const allocation=types.map(type=>{const rs=rows.filter(q=>q.type===type);return `<button type="button" class="cursor-interaction" data-outline-type="${type}" style="flex:1" aria-pressed="${!state.yearChapter&&state.outlineType===type}" aria-label="${type}，${rs.length}题，${points(rs)}分"><span>${type}</span><small>${rs.length}题 · ${points(rs)}分</small></button>`;}).join('');
    return `<section><header class="paper-heading"><div><h2>${state.year}年 · 年度试卷</h2><p class="paper-meta">${rows.length}题 · ${total}分 · 高数${points(rows.filter(q=>q.subject==='高等数学'))}分 / 线代${points(rows.filter(q=>q.subject==='线性代数'))}分</p></div>${yearPicker()}</header><div class="paper-split"><aside class="paper-browser" aria-label="年度试卷选题"><h3 class="paper-structure-title">题型</h3><div class="outline-allocation" aria-label="题型选择">${allocation}</div><details class="paper-overview" ${overviewOpen?'open':''}><summary>整卷分值分布</summary>${chapterDistribution(rows)}<div class="outline-profiles">${outlineProfile(rows,'difficulty')}${outlineProfile(rows,'calculation')}</div></details><div class="outline-heading"><div><h3>${esc(listTitle)}</h3><p>${items.length}题 · ${points(items)}分</p></div>${state.yearChapter?'<button type="button" class="cursor-interaction" data-clear-chapter="true">清除章节筛选</button>':''}</div><div class="paper-questions" aria-label="${esc(state.yearChapter||state.outlineType)}对应题目">${items.map(q=>`<button type="button" class="paper-choice cursor-interaction" data-outline-question="${esc(q.id)}" aria-pressed="${selected.id===q.id}" aria-label="第${q.original_number}题，${esc(q.model)}，${q.original_points}分，难度${difficulty(q)}，计算量${cost(q)}"><span class="paper-choice-number">${num(q.original_number).padStart(2,'0')}</span><span class="paper-choice-text"><span>${esc(q.model)}</span><span class="paper-choice-meta">${esc(q.chapter)} · ${q.original_points}分</span></span></button>`).join('')}</div></aside><section class="paper-detail" aria-label="选中题目"><div class="paper-reader-content">${questionReader(selected)}<div class="reader-route"><span>${esc(selected.model)}</span><button type="button" class="cursor-interaction" data-open-question="${esc(selected.id)}">查看同类考法 →</button></div></div></section></div></section>`;
  }
  function renderStudy(){return `<nav class="study-tabs" aria-label="试卷分析视图">${[{value:'year',label:'年度试卷'},{value:'topic',label:'考法研究'}].map(v=>`<button type="button" class="cursor-interaction" data-study-mode="${v.value}" aria-pressed="${state.studyMode===v.value}">${v.label}</button>`).join('')}</nav>${state.studyMode==='year'?renderPaper():renderTopic()}`;}
  const bands={difficulty:[{name:'1–2级 · 基础与较易',short:'1–2级',levels:[1,2],cls:'band-d0'},{name:'3级 · 中等',short:'3级',levels:[3],cls:'band-d1'},{name:'4–5级 · 较难与很难',short:'4–5级',levels:[4,5],cls:'band-d2'}],calculation:[{name:'低计算量',short:'低',levels:[1],cls:'band-c0'},{name:'中计算量',short:'中',levels:[2],cls:'band-c1'},{name:'高计算量',short:'高',levels:[3],cls:'band-c2'}]};
  function parts(rows,key){return bands[key].map(b=>({...b,points:points(rows.filter(q=>b.levels.includes(q[key]))),count:rows.filter(q=>b.levels.includes(q[key])).length}));}
  function chart(key,years){
    const legend=bands[key].map(b=>`<span><i class="chart-swatch ${b.cls}" aria-hidden="true"></i>${esc(b.name)}</span>`).join('');
    return `<figure class="annual-chart" aria-label="${key==='difficulty'?'逐年难度分值构成':'逐年计算量分值构成'}"><figcaption><h3>${key==='difficulty'?'难度分值构成':'计算量分值构成'}</h3></figcaption><div class="chart-legend">${legend}</div><div class="chart-axis" aria-hidden="true"><span>0</span><span>50</span><span>100</span><span>150分</span></div>${years.map(y=>{const qs=scoped().filter(q=>q.year===y),ps=parts(qs,key),pending=points(qs)-ps.reduce((n,b)=>n+b.points,0),label=`${y}年，${ps.map(b=>`${b.name}${b.points}分`).join('，')}${pending?`，未评级${pending}分`:''}`;return `<button type="button" class="annual-row cursor-interaction${y===2020&&years.includes(2021)?' annual-break':''}" data-year="${y}" aria-pressed="${state.year===y}" aria-label="${esc(label)}" data-tooltip="${esc(label)}"><span class="annual-year">${y}</span><span class="annual-track" aria-hidden="true">${ps.filter(b=>b.points>0).map(b=>`<span class="annual-segment ${b.cls}" style="width:${b.points/150*100}%">${b.points>=24?num(b.points):''}</span>`).join('')}${pending?`<span class="annual-segment band-pending" style="width:${pending/150*100}%"></span>`:''}</span></button>`;}).join('')}</figure>`;
  }
  function renderDifficulty(){
    const years=ensureYear(),qs=scoped().filter(q=>q.year===state.year).sort((a,b)=>a.original_number-b.original_number),ds=parts(qs,'difficulty'),cs=parts(qs,'calculation');
    const hard=qs.filter(q=>[4,5].includes(q.difficulty)),heavy=qs.filter(q=>q.calculation===3),shown=state.questionFocus==='hard'?hard:state.questionFocus==='heavy'?heavy:qs;
    if(!shown.some(q=>q.id===state.difficultyQuestion))state.difficultyQuestion=[...shown].sort((a,b)=>(b.difficulty??-1)-(a.difficulty??-1)||(b.calculation??-1)-(a.calculation??-1))[0]?.id||'';
    const q=rowById(state.difficultyQuestion),previous=years[years.indexOf(state.year)+1],next=years[years.indexOf(state.year)-1];
    const map=types.map(type=>{const items=shown.filter(q=>q.type===type);if(!items.length)return '';return `<div class="question-map-line"><div class="question-map-type">${type}<small>${items.length}题 · ${num(points(items))}分</small></div><div class="question-map-cells">${items.map(r=>`<button type="button" class="cursor-interaction grade-${r.difficulty||'pending'}" data-difficulty-question="${esc(r.id)}" aria-pressed="${r.id===state.difficultyQuestion}" aria-label="${r.year}年第${r.original_number}题，难度${difficulty(r)}，计算量${cost(r)}，${r.original_points}分" data-tooltip="第${r.original_number}题 · ${difficulty(r)} · 计算量${cost(r)}">${String(r.original_number).padStart(2,'0')}</button>`).join('')}</div></div>`;}).join('');
    const quickFilters=`<div class="question-focus" aria-label="逐题定位范围">${[{value:'all',label:'全部题目',rows:qs},{value:'hard',label:'较难题 · 4–5级',rows:hard},{value:'heavy',label:'高计算量',rows:heavy}].map(f=>`<button type="button" class="cursor-interaction" data-question-focus="${f.value}" aria-pressed="${state.questionFocus===f.value}" ${!f.rows.length?'disabled':''}>${f.label} · ${f.rows.length}题</button>`).join('')}</div><p class="focus-count">${shown.length?`当前列表：${shown.length}题 · ${points(shown)}分`:'该年未记录高计算量题，可切回全部题目。'}</p>`;
    const reading=q?`${questionReader(q)}<div class="reader-route"><button type="button" class="cursor-interaction" data-open-question="${esc(q.id)}">查看同类考法 →</button></div>`:'';
    return `<section><header class="difficulty-heading"><div><h2>难度评估</h2><p>${years[years.length-1]}—${years[0]} · ${years.length}年</p></div><div class="year-controls"><button type="button" class="cursor-interaction" data-year="${previous||state.year}" ${previous?'':'disabled'} aria-label="选择上一年">← 上一年</button>${yearPicker()}<button type="button" class="cursor-interaction" data-year="${next||state.year}" ${next?'':'disabled'} aria-label="选择下一年">下一年 →</button></div></header><div class="annual-charts">${chart('difficulty',years)}${chart('calculation',years)}</div><div class="annual-selection"><p><strong>${state.year}年 · ${qs.length}题 · ${num(points(qs))}分</strong>　1–2级 ${ds[0].points}分 / 3级 ${ds[1].points}分 / 4–5级 ${ds[2].points}分</p><p>计算量：低 ${cs[0].points}分 / 中 ${cs[1].points}分 / 高 ${cs[2].points}分。</p></div><div class="question-map-heading"><h3>${state.year}年 · 逐题难度</h3></div>${quickFilters}<div class="chart-legend" aria-label="逐题难度颜色说明">${[1,2,3,4,5].map(g=>`<span><i class="chart-swatch grade-${g}" aria-hidden="true"></i>${g}级 ${gradeNames[g]}</span>`).join('')}</div><div class="question-map" aria-label="${state.year}年按题型排列的题目难度">${map}</div>${reading}<details class="reference-notes"><summary>统计口径与参考</summary><p>按整题分值统计，等级仅作相对参考。</p><p>参考 <a href="https://www.ocr.org.uk/administration/support-and-tools/active-results/reports/unit-reports/question-level-analysis-report/" target="_blank" rel="noopener noreferrer">OCR逐题分析</a>。</p></details></section>`;
  }
  function render(){
    root.setAttribute('data-reader-layout',state.readerLayout);root.querySelector('#research-period').value=state.period;
    for(const button of root.querySelectorAll('[data-view]'))button.setAttribute('aria-pressed',String(button.dataset.view===state.view));
    main.innerHTML=state.view==='difficulty'?renderDifficulty():renderStudy();typeset();
  }
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button||!root.contains(button)||button.disabled)return;
    if(button.dataset.view){state.view=button.dataset.view;render();save();return;}
    if(button.dataset.studyMode){state.studyMode=button.dataset.studyMode;render();save();return;}
    if(button.dataset.topic){state.topic=button.dataset.topic;state.question='';state.view='study';state.studyMode='topic';render();save();return;}
    if(button.dataset.question){state.question=button.dataset.question;render();save();return;}
    if(button.dataset.chapter){state.yearChapter=state.yearChapter===button.dataset.chapter?'':button.dataset.chapter;state.outlineQuestion='';render();save();return;}
    if(button.dataset.clearChapter){state.yearChapter='';render();save();return;}
    if(button.dataset.questionFocus){state.questionFocus=button.dataset.questionFocus;render();save();return;}
    if(button.dataset.outlineType){state.outlineType=button.dataset.outlineType;state.yearChapter='';state.outlineQuestion='';render();save();return;}
    if(button.dataset.outlineQuestion){state.outlineQuestion=button.dataset.outlineQuestion;render();save();return;}
    if(button.dataset.openQuestion){const q=rowById(button.dataset.openQuestion);state.topic=q.model;state.question=q.id;state.view='study';state.studyMode='topic';render();save();return;}
    if(button.dataset.year){state.year=Number(button.dataset.year);state.difficultyQuestion='';state.yearChapter='';state.outlineQuestion='';render();save();return;}
    if(button.dataset.difficultyQuestion){state.difficultyQuestion=button.dataset.difficultyQuestion;render();save();return;}
    if(button.id==='research-standards'){const panel=root.querySelector('#standards-panel');panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));}
  });
  root.addEventListener('change',event=>{
    if(event.target.id==='research-period'){state.period=event.target.value;state.yearChapter='';state.outlineQuestion='';render();save();}
    if(event.target.id==='paper-year'){state.year=Number(event.target.value);state.difficultyQuestion='';state.yearChapter='';state.outlineQuestion='';render();save();}
  });
  restore(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addSelect(state,'readerLayout',{label:'题干与分析的排列方式',options:[{label:'上下串读',value:'stacked'},{label:'左右对读',value:'parallel'}]});}
  if(globalThis.ResizeObserver)new ResizeObserver(fitFormulae).observe(root);
})();
</script>
